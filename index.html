<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Munajat-e-Maqbool</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Munajat">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fafbf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121815" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Sans:wght@500;600&display=swap">
<style>
/* Layout: a book of pages, one dua per page, flicked sideways; each page scrolls down on its own when long */
:root{
  --bg:#fafbf8;          /* page, faint green bias */
  --panel:#f1f3ee;       /* commentary panels */
  --ink:#1c2420;         /* Arabic + English text */
  --muted:#5c6862;       /* secondary text */
  --green:#2f5444;       /* the edition's deep green */
  --gold:#b08d43;        /* the edition's gold hairlines */
  --line:#dfe3dc;
  --bar:#fafbf8;
  --serif:"EB Garamond", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --sans:"Instrument Sans", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --en: 1.2rem;
  --k: .17;              /* Arabic scale: CSS px per printed pixel, set by script */
  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --panel:#1b231f; --ink:#e7ebe4; --muted:#9aa69f; --green:#8fbfa6; --gold:#cfae67; --line:#2a332e; --bar:#121815; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121815; --panel:#1b231f; --ink:#e7ebe4; --muted:#9aa69f; --green:#8fbfa6; --gold:#cfae67; --line:#2a332e; --bar:#121815; color-scheme:dark;
}
/* reader's own Display choice wins over the phone setting */
:root[data-mode="light"]{
  --bg:#fafbf8; --panel:#f1f3ee; --ink:#1c2420; --muted:#5c6862; --green:#2f5444; --gold:#b08d43; --line:#dfe3dc; --bar:#fafbf8; color-scheme:light;
}
:root[data-mode="dark"]{
  --bg:#121815; --panel:#1b231f; --ink:#e7ebe4; --muted:#9aa69f; --green:#8fbfa6; --gold:#cfae67; --line:#2a332e; --bar:#121815; color-scheme:dark;
}
:root[data-mode="black"]{
  --bg:#000; --panel:#121212; --ink:#f4f4f2; --muted:#a3a3a0; --green:#a9cdb9; --gold:#d6b46c; --line:#262626; --bar:#000; color-scheme:dark;
}
html{height:100%;box-sizing:border-box;-webkit-text-size-adjust:100%}
body{margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bar)}

/* top bar */
.bar{position:relative;flex:none;padding-block:10px;padding-left:var(--gut-l);padding-right:var(--gut-r);background:var(--bar);border-bottom:1px solid var(--line)}
.bar-in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:10px}
.where{flex:1;min-width:0;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where b{font-weight:600}
.where span{color:var(--muted)}
.btn{font-family:var(--sans);font-weight:600;font-size:.82rem;color:var(--green);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:36px;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.progress{position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:var(--gold);transform-origin:0 50%;transform:scaleX(0);transition:transform .2s}
[dir="rtl"] .progress{transform-origin:100% 50%}

/* the book */
.pager{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pager::-webkit-scrollbar{display:none}
.page{outline:none;flex:0 0 100%;width:100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;font-family:var(--serif)}
.pin{max-width:620px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:24px 40px;display:grid;gap:18px;align-content:start}

.hero{display:grid;gap:6px;padding-block:18px 14px}
.kicker{font-family:var(--sans);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hero h1{margin:0;font-weight:500;font-size:clamp(3rem,15vw,4.4rem);line-height:.95;color:var(--green);letter-spacing:-.01em}
.hero p{margin:6px 0 0;font-size:1.08rem;color:var(--muted)}

.sh{display:flex;align-items:baseline;gap:12px}
.sh::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent);opacity:.55;align-self:center}
.eyebrow{font-family:var(--sans);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
.num{font-size:2.2rem;line-height:1;font-weight:500;color:var(--gold);font-variant-numeric:lining-nums}
.num.word{font-size:1.6rem;color:var(--green)}
.bism{display:grid;gap:10px;justify-items:center;padding-bottom:8px}

/* Arabic: each printed word is a window onto its printed line, so words rewrap right to left at any size */
.arw{display:flex;flex-wrap:wrap;direction:rtl;justify-content:center;align-items:flex-start;max-width:100%;
  padding-top:calc(var(--k) * 36px)}
.ln{display:contents}
.ln i{display:block;flex:none;width:calc(var(--w) * var(--k) * 1px);height:calc(var(--H) * var(--k) * 1px);
  margin-left:calc(var(--g) * var(--k) * 1px);margin-top:calc(var(--k) * -36px);
  background:var(--ink);
  -webkit-mask-image:var(--m);mask-image:var(--m);
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-size:calc(var(--lw) * var(--k) * 1px) 100%;mask-size:calc(var(--lw) * var(--k) * 1px) 100%;
  -webkit-mask-position:calc(var(--x) * var(--k) * -1px) 0;mask-position:calc(var(--x) * var(--k) * -1px) 0}
.en{margin:0;font-size:var(--en);line-height:1.55;max-width:65ch;text-wrap:pretty}
.en-quiet{font-size:calc(var(--en) * .86);color:var(--muted);text-align:center}
.closing .en{text-align:center;margin-inline:auto}
.seg button.arb{font-family:"Geeza Pro","Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;line-height:1}
.swipe-hint{margin:8px 0 0;font-family:var(--sans);font-size:.8rem;letter-spacing:.04em;color:var(--gold);text-align:center}

body.no-en .en:not(.en-quiet){display:none}

.about{border-top:1px solid var(--gold);margin-top:8px;padding-top:18px;color:var(--muted);font-size:.95rem;line-height:1.5}
.about h3{font-family:var(--sans);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;margin:0 0 8px;color:var(--green)}
.about p{margin:0 0 10px}

/* page footer */
.foot{flex:none;border-top:1px solid var(--line);background:var(--bar);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom, 0px));padding-left:var(--gut-l);padding-right:var(--gut-r)}
.foot-in{max-width:620px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.turn{display:grid;place-items:center;width:48px;height:44px;border:0;background:transparent;color:var(--green);cursor:pointer;border-radius:10px}
.turn:disabled{opacity:.25;cursor:default}
.turn svg{width:22px;height:22px}
[dir="rtl"] .turn svg{transform:scaleX(-1)}
.count{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.03em}

/* sheets */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,14,12,.38)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:16px 16px 0 0;border-top:1px solid var(--line);
  max-height:80%;overflow:auto;padding-top:10px;padding-bottom:calc(20px + env(safe-area-inset-bottom, 0px));padding-left:var(--gut-l);padding-right:var(--gut-r);
  box-shadow:0 -8px 30px rgba(0,0,0,.15);font-family:var(--serif)}
.sheet-in{max-width:620px;margin:0 auto;display:grid;gap:16px}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 0}
.sheet-h{display:flex;align-items:center;justify-content:space-between}
.sheet-h h2{margin:0;font-weight:500;font-size:1.5rem;color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.jn{display:grid;place-items:center;min-height:48px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);font-size:1.2rem;font-variant-numeric:lining-nums tabular-nums}
.jn.wide{grid-column:span 2;font-size:1rem;line-height:1.1}
.jn small{font-family:var(--sans);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.jn.cur{border-color:var(--gold);background:var(--panel);color:var(--green)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:8px;border-bottom:1px solid var(--line)}
.row label,.row .lbl{font-size:1.1rem}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{font-family:var(--serif);font-size:1rem;border:0;background:transparent;color:var(--ink);min-width:44px;min-height:40px;padding-inline:12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--bg)}
.sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw:checked{background:var(--green)}
.sw:checked::after{transform:translateX(20px)}
.hint{font-size:.95rem;color:var(--muted);margin:0;line-height:1.45}
@media (prefers-reduced-motion: reduce){.progress,.sw::after{transition:none}}
:root{--H:255}
/* dua header theme, notes, review, sources */
.theme{margin:-8px 0 0;font-family:var(--serif);font-style:italic;font-size:1.12rem;color:var(--muted)}
.en.c{text-align:center;margin-inline:auto}
.box{background:var(--panel);border-radius:6px;padding:14px 16px 16px;display:grid;gap:8px}
.box h3{margin:0;font-family:var(--sans);font-size:.68rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--green)}
.box p,.np{margin:0;font-size:calc(var(--en) * .9);line-height:1.55;color:var(--muted)}
.review{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:8px}
.review h3{margin:0;font-family:var(--sans);font-size:.68rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--green)}
body.no-comm .box:not(.how),body.no-comm .review{display:none}
.src{border-top:1px solid var(--line);margin-top:4px}
.src summary{list-style:none;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;padding:14px 0 6px;cursor:pointer;font-family:var(--sans);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--green)}
.src summary::-webkit-details-marker{display:none}
.src summary span::after{content:" +";color:var(--gold)}
.src[open] summary span::after{content:" −"}
.src summary small{font-size:.72rem;letter-spacing:.02em;text-transform:none;color:var(--muted);font-family:var(--serif);font-size:.95rem}
.src-in{display:grid;gap:6px;padding:6px 0 4px}
.src-in .srcl{margin-top:8px}
/* documents: introduction, glossary, sources */
.dt{margin:6px 0 0;font-family:var(--serif);font-weight:500;font-size:2.05rem;line-height:1.1;color:var(--green);text-wrap:balance}
.dh{margin:10px 0 0;font-family:var(--serif);font-weight:500;font-size:1.3rem;line-height:1.25;color:var(--green);text-wrap:balance}
.dh small{font-size:.95rem;color:var(--muted);font-weight:400}
.dp{margin:0;font-family:var(--serif);font-size:calc(var(--en) * .92);line-height:1.55;max-width:65ch;text-wrap:pretty}
.dp.muted{color:var(--muted)}
.dp.c{text-align:center;margin-inline:auto}
.srcl{font-weight:500}
.page a{color:var(--green);text-decoration-color:color-mix(in srgb, var(--gold) 70%, transparent);text-underline-offset:3px}
.verse{margin:8px 0;text-align:center;font-family:var(--serif);font-style:italic;font-size:1.35rem;line-height:1.5;color:var(--green);text-wrap:balance}
p.eyebrow{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0}
.chips a{display:inline-grid;place-items:center;min-width:44px;min-height:36px;padding:0 8px;border:1px solid var(--line);border-radius:8px;text-decoration:none;font-family:var(--serif);font-size:1.05rem;font-variant-numeric:lining-nums tabular-nums;color:var(--ink)}
.dl{list-style:none;margin:0;padding:0;display:grid}
.dl a{display:grid;grid-template-columns:3.4rem minmax(0,1fr);gap:8px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.dl b{font-weight:500;color:var(--gold);font-variant-numeric:lining-nums tabular-nums}
.dl span{font-size:1.05rem}
.cover{display:grid;gap:12px;padding-top:12px}
.cover h1{margin:6px 0 0;font-weight:500;font-size:clamp(2.4rem,11vw,3.4rem);line-height:1;color:var(--green)}
.cover .sub2{margin:0;font-size:1.3rem;color:var(--green)}
/* index sheet */
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--panel)}
.search svg{width:18px;height:18px;flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-family:var(--serif);font-size:1.1rem;padding:11px 0;outline:none}
.search:focus-within{border-color:var(--gold)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.secs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.dy{position:relative;display:grid;place-items:center;min-height:46px;padding:6px 2px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font-family:var(--serif);font-size:1.05rem;cursor:pointer}
.secs .dy{font-family:var(--sans);font-size:.78rem;font-weight:600;color:var(--green);min-height:40px}
.dy[aria-current="true"]{border-color:var(--gold);background:var(--panel);color:var(--green)}
.dy.today::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.sub{margin:0;font-family:var(--sans);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.list{display:grid}
.li{display:grid;grid-template-columns:3.2rem minmax(0,1fr);gap:8px;align-items:baseline;padding:10px 6px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:1.05rem;border-radius:6px}
.li b{font-weight:500;color:var(--gold);font-variant-numeric:lining-nums tabular-nums}
.li.cur{background:var(--panel)}
.li.cur b{color:var(--green)}
.li small{display:block;margin-top:2px;font-size:.9rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.li mark{background:color-mix(in srgb, var(--gold) 30%, transparent);color:inherit;border-radius:2px}
.empty{margin:4px 0;color:var(--muted);font-size:1.05rem}
.state{flex:0 0 100%;display:grid;place-content:center;justify-items:center;gap:14px;padding-inline:var(--gut-l) var(--gut-r);text-align:center;font-family:var(--serif);font-size:1.15rem;color:var(--muted)}
.state .btn{font-size:.9rem}
.nextday{justify-self:center;margin-top:6px;font-family:var(--sans);font-weight:600;font-size:.9rem;color:var(--bg);background:var(--green);border:0;border-radius:999px;padding:12px 20px;cursor:pointer}
</style>
<style>html{padding-top:env(safe-area-inset-top, 0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>

<div class="bar" id="bar">
  <div class="bar-in" dir="ltr">
    <div class="where" id="where"><b>Munajat-e-Maqbool</b></div>
    <button class="btn" id="openIndex" type="button" aria-haspopup="dialog">Index</button>
    <button class="btn" id="openSettings" type="button" aria-haspopup="dialog" aria-label="Reading settings">Aa</button>
  </div>
  <div class="progress" id="progress"></div>
</div>

<main class="pager" id="pager" dir="ltr">
  <div class="state"><span>Opening…</span></div>
</main>

<nav class="foot" id="foot" dir="ltr" aria-label="Turn pages">
  <div class="foot-in">
    <button class="turn" id="prev" type="button" aria-label="Previous page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="count" id="count"></span>
    <button class="turn" id="next" type="button" aria-label="Next page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="indexSheet" role="dialog" aria-modal="true" aria-labelledby="ixh" hidden>
  <div class="sheet-in">
    <div class="grab"></div>
    <div class="sheet-h"><h2 id="ixh">Index</h2><button class="btn" type="button" data-close>Done</button></div>
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search duʿās: forgiveness, parents, 112…" autocomplete="off" aria-label="Search duʿās"></label>
    <div id="browse">
      <div class="days" id="days" role="group" aria-label="Day"></div>
      <div class="secs" id="secs" role="group" aria-label="More" style="margin-top:6px"></div>
      <p class="sub" id="daySub" style="margin-top:14px"></p>
      <nav class="list" id="grid"></nav>
    </div>
    <nav class="list" id="results" hidden></nav>
  </div>
</div>
<div class="sheet" id="setSheet" role="dialog" aria-modal="true" aria-labelledby="sth" hidden>
  <div class="sheet-in">
    <div class="grab"></div>
    <div class="sheet-h"><h2 id="sth">Reading</h2><button class="btn" type="button" data-close>Done</button></div>
    <div class="row"><span class="lbl">Display</span>
      <div class="seg" id="modeSeg"><button type="button" data-m="auto">Auto</button><button type="button" data-m="light">Light</button><button type="button" data-m="dark">Dark</button><button type="button" data-m="black">Black</button></div></div>
    <div class="row"><span class="lbl">Arabic size</span>
      <div class="seg" id="arSeg"><button type="button" data-a="1" aria-label="Small" class="arb">ع</button><button type="button" data-a="1.3" aria-label="Medium" class="arb" style="font-size:1.35rem">ع</button><button type="button" data-a="1.6" aria-label="Large" class="arb" style="font-size:1.6rem">ع</button></div></div>
    <div class="row"><span class="lbl">English size</span>
      <div class="seg" id="sizeSeg"><button type="button" data-s="1.05rem" aria-label="Small">A</button><button type="button" data-s="1.2rem" aria-label="Medium" style="font-size:1.15rem">A</button><button type="button" data-s="1.38rem" aria-label="Large" style="font-size:1.3rem">A</button></div></div>
    <div class="row"><label for="tEn">Translation</label><input class="sw" type="checkbox" id="tEn" checked></div>
    <div class="row"><label for="tComm">Commentary and notes</label><input class="sw" type="checkbox" id="tComm" checked></div>
    <div class="row"><span class="lbl">Page turning</span>
      <div class="seg" id="dirSeg"><button type="button" data-d="ltr">English book</button><button type="button" data-d="rtl">Urdu book</button></div></div>
    <p class="hint" id="dirHint"></p>
    <p class="hint">The Arabic is the original printing. At larger sizes the words wrap onto more lines than in the book. On a new day the app opens that day's portion.</p>
  </div>
</div>

<script>
(function(){
  var DATA={"days": [{"key": "saturday", "name": "Saturday", "manzil": "First manzil", "first": "1", "last": "54", "count": 54, "ids": ["d1", "d2", "d3", "d4", "d5", "d6", "d7", "d8", "d9", "d10", "d11", "d12", "d13", "d14", "d15", "d16", "d17", "d18", "d19", "d20", "d21", "d22", "d23", "d24", "d25", "d26", "d27", "d28", "d29", "d30", "d31", "d32", "d33", "d34", "d35", "d36", "d37", "d38", "d39", "d40", "d41", "d42", "d43", "d44", "d45", "d46", "d47", "d48", "d49", "d50", "d51", "d52", "d53", "d54"], "file": "days/saturday.html"}, {"key": "sunday", "name": "Sunday", "manzil": "Second manzil", "first": "55", "last": "85", "count": 31, "ids": ["d55", "d56", "d57", "d58", "d59", "d60", "d61", "d62", "d63", "d64", "d65", "d66", "d67", "d68", "d69", "d70", "d71", "d72", "d73", "d74", "d75", "d76", "d77", "d78", "d79", "d80", "d81", "d82", "d83", "d84", "d85"], "file": "days/sunday.html"}, {"key": "monday", "name": "Monday", "manzil": "Third manzil", "first": "86", "last": "116", "count": 31, "ids": ["d86", "d87", "d88", "d89", "d90", "d91", "d92", "d93", "d94", "d95", "d96", "d97", "d98", "d99", "d100", "d101", "d102", "d103", "d104", "d105", "d106", "d107", "d108", "d109", "d110", "d111", "d112", "d113", "d114", "d115", "d116"], "file": "days/monday.html"}, {"key": "tuesday", "name": "Tuesday", "manzil": "Fourth manzil", "first": "117", "last": "150", "count": 34, "ids": ["d117", "d118", "d119", "d120", "d121", "d122", "d123", "d124", "d125", "d126", "d127", "d128", "d129", "d130", "d131", "d132", "d133", "d134", "d135", "d136", "d137", "d138", "d139", "d140", "d141", "d142", "d143", "d144", "d145", "d146", "d147", "d148", "d149", "d150"], "file": "days/tuesday.html"}, {"key": "wednesday", "name": "Wednesday", "manzil": "Fifth manzil", "first": "151", "last": "174", "count": 24, "ids": ["d151", "d152", "d153", "d154", "d155", "d156", "d157", "d158", "d159", "d160", "d161", "d162", "d163", "d164", "d165", "d166", "d167", "d168", "d169", "d170", "d171", "d172", "d173", "d174"], "file": "days/wednesday.html"}, {"key": "thursday", "name": "Thursday", "manzil": "Sixth manzil", "first": "175", "last": "190", "count": 16, "ids": ["d175", "d176", "d177", "d178", "d179", "d180", "d181", "d182", "d183", "d184", "d185", "d186", "d187", "d188", "d189", "d190"], "file": "days/thursday.html"}, {"key": "friday", "name": "Friday", "manzil": "Seventh manzil", "first": "191", "last": "203(b)", "count": 17, "ids": ["d191", "d192", "d193", "d193a", "d193b", "d194", "d195", "d196", "d197", "d198", "d199", "d200", "d201", "d202", "d203", "d203a", "d203b"], "file": "days/friday.html"}], "secs": [{"key": "intro", "name": "Introduction", "short": "Intro", "file": "days/intro.html", "pages": [{"id": "cover", "label": "Cover"}, {"id": "about", "label": "About this edition"}, {"id": "guide", "label": "Reading and sources"}, {"id": "foreword", "label": "Foreword"}, {"id": "poem", "label": "Opening poem"}]}, {"key": "glossary", "name": "Glossary", "short": "Glossary", "file": "days/glossary.html", "pages": [{"id": "glossary", "label": "Glossary"}]}, {"key": "topics", "name": "Topics", "short": "Topics", "file": "days/topics.html", "pages": [{"id": "topics", "label": "Topic index"}, {"id": "alldua", "label": "Every duʿā"}]}, {"key": "sources", "name": "About the sources", "short": "Sources", "file": "days/sources.html", "pages": [{"id": "review", "label": "Reference review"}, {"id": "general", "label": "Opening and closing references"}, {"id": "record", "label": "Edition record"}]}], "search": [{"id": "d1", "n": "1", "d": "sat", "t": "Good in both worlds", "e": "Our Lord, grant us good in this world and good in the Hereafter, and protect us from the punishment of the Fire."}, {"id": "d2", "n": "2", "d": "sat", "t": "Patience and firm resolve", "e": "Our Lord, pour patience upon us, make our feet firm, and grant us victory over the disbelieving people."}, {"id": "d3", "n": "3", "d": "sat", "t": "Forgiveness and relief from burdens", "e": "Our Lord, do not take us to task if we forget or make a mistake. Our Lord, do not lay upon us a burden like that which You laid upon those before us. Our Lord, do not burden us with what we have no strength to bear. Pardon us, forgive us, and have mercy on us. You are our Protector, so grant us victory over the disbelieving people."}, {"id": "d4", "n": "4", "d": "sat", "t": "Hearts steadfast in guidance", "e": "Our Lord, do not cause our hearts to deviate after You have guided us, and grant us mercy from Yourself. Surely You are the Bestower."}, {"id": "d5", "n": "5", "d": "sat", "t": "Faith and forgiveness", "e": "Our Lord, we have believed, so forgive us our sins and protect us from the punishment of the Fire."}, {"id": "d6", "n": "6", "d": "sat", "t": "Creation and salvation", "e": "Our Lord, You have not created this in vain. Glory be to You! Protect us from the punishment of the Fire."}, {"id": "d7", "n": "7", "d": "sat", "t": "Protection from disgrace", "e": "Our Lord, whoever You admit to the Fire, You have indeed disgraced; and the wrongdoers will have no helpers."}, {"id": "d8", "n": "8", "d": "sat", "t": "Faith and a righteous end", "e": "Our Lord, we heard a caller calling to faith: 'Believe in your Lord,' and we believed. Our Lord, forgive us our sins, wipe away our evil deeds, and cause us to die among the righteous."}, {"id": "d9", "n": "9", "d": "sat", "t": "Fulfilment of the divine promise", "e": "Our Lord, grant us what You promised us through Your messengers, and do not disgrace us on the Day of Resurrection. Surely You do not break Your promise."}, {"id": "d10", "n": "10", "d": "sat", "t": "Adam and his wife’s prayer of repentance", "e": "Our Lord, we have wronged ourselves. If You do not forgive us and have mercy on us, we shall surely be among the losers."}, {"id": "d11", "n": "11", "d": "sat", "t": "Patience and a Muslim death", "e": "Our Lord, pour patience upon us, and cause us to die as Muslims."}, {"id": "d12", "n": "12", "d": "sat", "t": "Allah as Protector", "e": "You are our Protector, so forgive us and have mercy on us. You are the best of those who forgive."}, {"id": "d13", "n": "13", "d": "sat", "t": "Deliverance from oppression", "e": "Our Lord, do not make us a trial for the wrongdoing people, and deliver us by Your mercy from the disbelieving people."}, {"id": "d14", "n": "14", "d": "sat", "t": "Yusuf’s prayer for a righteous end", "e": "Creator of the heavens and the earth, You are my Protector in this world and the Hereafter. Cause me to die as a Muslim, and join me with the righteous."}, {"id": "d15", "n": "15", "d": "sat", "t": "Establishing prayer", "e": "My Lord, make me one who establishes prayer, and my offspring as well. Our Lord, accept my supplication."}, {"id": "d16", "n": "16", "d": "sat", "t": "Forgiveness for parents and believers", "e": "Our Lord, forgive me, my parents and the believers on the Day when the reckoning is established."}, {"id": "d17", "n": "17", "d": "sat", "t": "Mercy for parents", "e": "My Lord, have mercy on them, as they nurtured me when I was small."}, {"id": "d18", "n": "18", "d": "sat", "t": "An honourable entrance and exit", "e": "My Lord, let me enter in truth and depart in truth, and grant me from Yourself a supporting authority."}, {"id": "d19", "n": "19", "d": "sat", "t": "Mercy and right guidance", "e": "Our Lord, grant us mercy from Yourself, and arrange for us right guidance in our affair."}, {"id": "d20", "n": "20", "d": "sat", "t": "Musa’s prayer for ease and clear speech", "e": "My Lord, open my breast for me, make my task easy for me, and untie the knot from my tongue, so that they may understand my speech."}, {"id": "d21", "n": "21", "d": "sat", "t": "Increase in knowledge", "e": "My Lord, increase me in knowledge."}, {"id": "d22", "n": "22", "d": "sat", "t": "Ayyub’s prayer in hardship", "e": "Indeed, hardship has touched me, and You are the Most Merciful of the merciful."}, {"id": "d23", "n": "23", "d": "sat", "t": "Zakariyya’s prayer for family", "e": "My Lord, do not leave me alone, for You are the best of inheritors."}, {"id": "d24", "n": "24", "d": "sat", "t": "A blessed place to settle", "e": "My Lord, let me settle in a blessed place; You are the best of those who grant a place to settle."}, {"id": "d25", "n": "25", "d": "sat", "t": "Protection from devils", "e": "My Lord, I seek refuge in You from the promptings of devils, and I seek refuge in You, my Lord, lest they come near me."}, {"id": "d26", "n": "26", "d": "sat", "t": "Faith, forgiveness and mercy", "e": "Our Lord, we have believed, so forgive us and have mercy on us. You are the best of those who show mercy."}, {"id": "d27", "n": "27", "d": "sat", "t": "Protection from Hell", "e": "Our Lord, turn away from us the punishment of Hell. Its punishment is surely unrelenting."}, {"id": "d28", "n": "28", "d": "sat", "t": "Righteous family and leadership", "e": "Our Lord, grant us comfort to our eyes from our spouses and offspring, and make us leaders for the God-fearing."}, {"id": "d29", "n": "29", "d": "sat", "t": "Gratitude and righteous deeds", "e": "My Lord, enable me to be thankful for the favour You have bestowed upon me and upon my parents, and to do good deeds that please You. Admit me, by Your mercy, among Your righteous servants."}, {"id": "d30", "n": "30", "d": "sat", "t": "Musa’s prayer in need", "e": "My Lord, I am in need of whatever good You send down to me."}, {"id": "d31", "n": "31", "d": "sat", "t": "Help against corruption", "e": "My Lord, help me against the people who spread corruption."}, {"id": "d32", "n": "32", "d": "sat", "t": "Forgiveness for the repentant", "e": "Our Lord, You encompass all things in mercy and knowledge. Forgive those who repent and follow Your way, and protect them from the punishment of Hell."}, {"id": "d33", "n": "33", "d": "sat", "t": "Paradise with righteous family", "e": "Our Lord, admit them to the Gardens of lasting residence which You have promised them, together with the righteous among their forebears, spouses and descendants. You alone are the Almighty, the All-Wise. Protect them from evil consequences. Whoever You protect from evil consequences on that Day has truly received Your mercy. That is the supreme success."}, {"id": "d34", "n": "34", "d": "sat", "t": "Gratitude, repentance and righteous descendants", "e": "Make my descendants righteous for me. I turn to You in repentance, and I am among those who submit to You."}, {"id": "d35", "n": "35", "d": "sat", "t": "Nuh’s prayer when overwhelmed", "e": "I am overwhelmed, so avenge me."}, {"id": "d36", "n": "36", "d": "sat", "t": "Forgiveness and a heart free of rancour", "e": "Our Lord, forgive us and our brothers who preceded us in faith. Do not place in our hearts any ill will towards those who believe. Our Lord, You are Most Kind, Most Merciful."}, {"id": "d37", "n": "37", "d": "sat", "t": "Trust and return to Allah", "e": "Our Lord, in You we have placed our trust, to You we turn, and to You is the final return."}, {"id": "d38", "n": "38", "d": "sat", "t": "Protection from persecution", "e": "Our Lord, do not make us a trial for those who disbelieve. Forgive us, our Lord. You alone are the Almighty, the All-Wise."}, {"id": "d39", "n": "39", "d": "sat", "t": "Perfected light and forgiveness", "e": "Our Lord, perfect our light for us and forgive us. You have power over all things."}, {"id": "d40", "n": "40", "d": "sat", "t": "Forgiveness for all believers", "e": "My Lord, forgive me, my parents, everyone who enters my house as a believer, and all believing men and women."}, {"id": "d41", "n": "41", "d": "sat", "t": "Cleansing the heart of sins", "e": "O Allah, wash away my sins with the water of snow and hail, and cleanse my heart of sins as a white garment is cleansed of dirt. Put distance between me and my sins as You have put distance between the east and the west."}, {"id": "d42", "n": "42", "d": "sat", "t": "Purifying the soul", "e": "O Allah, grant my soul its piety and purify it. You are the best to purify it; You are its Guardian and Master."}, {"id": "d43", "n": "43", "d": "sat", "t": "The good sought by the Prophet", "e": "We ask You for the good which Your Prophet Muhammad, may Allah bless him and grant him peace, asked of You."}, {"id": "d44", "n": "44", "d": "sat", "t": "Forgiveness, good deeds and salvation", "e": "We ask You for the means of Your forgiveness, the deeds that fulfil Your command, safety from every sin, a share of every good, success in attaining Paradise, and deliverance from the Fire."}, {"id": "d45", "n": "45", "d": "sat", "t": "Beneficial knowledge", "e": "I ask You for beneficial knowledge."}, {"id": "d46", "n": "46", "d": "sat", "t": "Forgiveness for mistakes and deliberate sins", "e": "O Allah, forgive my sins, those committed by mistake and deliberately."}, {"id": "d47", "n": "47", "d": "sat", "t": "Forgiveness for ignorance and excess", "e": "O Allah, forgive my sin, my ignorance, my excesses in my affairs, and what You know better than I do."}, {"id": "d48", "n": "48", "d": "sat", "t": "Forgiveness in earnest and in jest", "e": "O Allah, forgive what I have done in earnest and in jest."}, {"id": "d49", "n": "49", "d": "sat", "t": "Hearts directed to obedience", "e": "O Allah, Director of hearts, direct our hearts to obey You."}, {"id": "d50", "n": "50", "d": "sat", "t": "Guidance and a straight course", "e": "O Allah, guide me and keep me on the right course."}, {"id": "d51", "n": "51", "d": "sat", "t": "Guidance, piety and contentment", "e": "O Allah, I ask You for guidance, piety, chastity and freedom from need."}, {"id": "d52", "n": "52", "d": "sat", "t": "Religion, worldly life and the Hereafter", "e": "O Allah, put right for me my religion, which safeguards my affairs. Put right for me my worldly life, in which is my livelihood. Put right for me my Hereafter, to which I must return. Make life an increase for me in every good, and make death a relief for me from every evil."}, {"id": "d53", "n": "53", "d": "sat", "t": "Forgiveness, mercy, well-being and provision", "e": "O Allah, forgive me, have mercy on me, grant me well-being, and provide for me."}, {"id": "d54", "n": "54", "d": "sat", "t": "Comprehensive protection from spiritual and worldly harms", "e": "O Allah, I seek refuge in You from helplessness, laziness, cowardice, decrepit old age, debt and sin; from the punishment of the Fire and the trial of the Fire; from the trial of the grave and the punishment of the grave; from the evil trial of wealth and the evil trial of poverty; from the evil trial of the false Messiah; and from the trials of life and death; from hardness of heart, heedlessness, poverty, humiliation, destitution, unbelief, wickedness, dissension, seeking praise and showing off; from deafness, loss of speech, madness, leprosy and grievous illnesses; from the burden of debt, anxiety, sorrow, miserliness and being overpowered by others; from being reduced to the feeblest stage of old age, the trials of this world, knowledge that does not benefit, a heart that does not humble itself, a soul that is never satisfied, and a prayer that is not answered."}, {"id": "d55", "n": "55", "d": "sun", "t": "Help, gratitude, repentance and a purified heart", "e": "My Lord, help me and do not help anyone against me. Grant me victory and do not grant victory over me. Plan in my favour and do not plan against me. Guide me, make guidance easy for me, and grant me victory over whoever wrongs me. My Lord, make me one who remembers You often, thanks You abundantly, fears You greatly, and is eager to obey You, obedient to You, humble before You, earnest in supplication to You, and constantly turning to You. My Lord, accept my repentance, wash away my sins, answer my prayer, make my proof firm, set my tongue straight, guide my heart, and remove the rancour from my breast."}, {"id": "d56", "n": "56", "d": "sun", "t": "Forgiveness, mercy and all affairs put right", "e": "O Allah, forgive us, have mercy on us, be pleased with us, admit us to Paradise, save us from the Fire, and set all our affairs right."}, {"id": "d57", "n": "57", "d": "sun", "t": "United hearts, peace and blessings for the family", "e": "O Allah, unite our hearts, put our relationships right, guide us along the paths of peace, deliver us from darkness into light, and keep us away from shameful deeds, both open and hidden. Bless our hearing, our sight, our hearts, our spouses and our offspring. Accept our repentance, for You are the Accepter of repentance, the Most Merciful. Make us grateful for Your favour, praising You for it and accepting it, and perfect it for us."}, {"id": "d58", "n": "58", "d": "sun", "t": "Steadfastness, gratitude and upright character", "e": "O Allah, I ask You for steadfastness in religion, and I ask You for firm resolve in righteousness. I ask You for gratitude for Your favour and excellence in worshipping You. I ask You for a truthful tongue, a sound heart and upright character. I ask You for the good that You know, and I seek Your forgiveness for what You know. Surely You are the Knower of all unseen things."}, {"id": "d59", "n": "59", "d": "sun", "t": "Forgiveness, reverence and protection of religion", "e": "O Allah, forgive me for what I have done earlier and later, for what I have concealed and what I have made known, and for what You know better than I do. O Allah, grant us such fear of You as will come between us and disobedience to You; such obedience to You as will bring us to Your Paradise; and such certainty as will make the hardships of this world easy for us. Let us benefit from our hearing and our sight and our strength for as long as You keep us alive, and let these remain with us to the end. Direct our retribution against those who have wronged us, and grant us victory over those who are hostile to us. Do not let our misfortune be in our religion. Do not make this world our greatest concern, the limit of our knowledge or the furthest aim of our desire. Do not place over us anyone who has no mercy on us."}, {"id": "d60", "n": "60", "d": "sun", "t": "Increase, honour, provision and contentment", "e": "O Allah, increase us and do not diminish us; honour us and do not humiliate us; give to us and do not deprive us; favour us and do not favour others over us; make us content and be pleased with us."}, {"id": "d61", "n": "61", "d": "sun", "t": "Inspiration toward right guidance", "e": "O Allah, inspire me with right guidance."}, {"id": "d62", "n": "62", "d": "sun", "t": "Protection from the self and resolve for right conduct", "e": "O Allah, protect me from the evil of my own self, and grant me firm resolve to put my affairs right."}, {"id": "d63", "n": "63", "d": "sun", "t": "Well-being in this world and the Hereafter", "e": "I ask Allah for well-being in this world and the Hereafter."}, {"id": "d64", "n": "64", "d": "sun", "t": "Good deeds, love and protection from trials", "e": "O Allah, I ask You to enable me to do good deeds, leave evil deeds and love the poor, and I ask You to forgive me and have mercy on me. When You intend a trial for a people, take me in death before I am afflicted by it. I ask You for Your love, the love of those who love You, and the love of deeds that bring me closer to Your love."}, {"id": "d65", "n": "65", "d": "sun", "t": "Love of Allah above self, family and comfort", "e": "O Allah, make Your love dearer to me than my own self, my family and cool water."}, {"id": "d66", "n": "66", "d": "sun", "t": "Loved gifts as strength for obedience", "e": "O Allah, grant me Your love and the love of those whose love will benefit me in Your sight. O Allah, whatever You have granted me of the things I love, make it a source of strength for me in doing what You love."}, {"id": "d67", "n": "67", "d": "sun", "t": "Freedom for what Allah loves", "e": "O Allah, whatever You have withheld from me of the things I love, make that a means of freeing me for what You love."}, {"id": "d68", "n": "68", "d": "sun", "t": "A heart firm upon religion", "e": "O Turner of hearts, keep my heart firm upon Your religion."}, {"id": "d69", "n": "69", "d": "sun", "t": "Unwavering faith and companionship in Paradise", "e": "O Allah, I ask You for faith that does not turn back, bliss that never ends, and the companionship of Your Prophet Muhammad, may Allah bless him and grant him peace, in the highest rank of Paradise, the everlasting Garden."}, {"id": "d70", "n": "70", "d": "sun", "t": "Health, faith, character and success", "e": "O Allah, I ask You for health accompanied by faith, faith accompanied by good character, success which You follow with prosperity, mercy from You, well-being, forgiveness from You and Your good pleasure."}, {"id": "d71", "n": "71", "d": "sun", "t": "Beneficial knowledge", "e": "O Allah, benefit me through what You have taught me, and teach me what will benefit me."}, {"id": "d72", "n": "72", "d": "sun", "t": "Life, death, contentment and the vision of Allah", "e": "O Allah, by Your knowledge of the unseen and Your power over creation, keep me alive for as long as You know life to be better for me, and cause me to die when You know death to be better for me. I ask You for reverent fear of You in private and in public, and for sincere speech in contentment and in anger. I ask You for bliss that never runs out and joy that never ends. I ask You for contentment with Your decree, a pleasant life after death, the delight of looking upon Your countenance and longing to meet You. I seek refuge in You from affliction that causes harm and trials that lead astray. O Allah, adorn us with the beauty of faith, and make us guides who are rightly guided."}, {"id": "d73", "n": "73", "d": "sun", "t": "Every good, known and unknown", "e": "O Allah, I ask You for every good, both immediate and deferred, what I know of it and what I do not know."}, {"id": "d74", "n": "74", "d": "sun", "t": "Paradise and a good outcome for every decree", "e": "O Allah, I ask You for the good that Your servant and Your Prophet asked of You. O Allah, I ask You for Paradise and whatever brings one nearer to it, in word or deed. I ask You to make every decree concerning me good, and I ask You to make the outcome of whatever You have decreed for me rightly guided."}, {"id": "d75", "n": "75", "d": "sun", "t": "A good ending and protection from disgrace", "e": "O Allah, make the outcome of all our affairs good, and protect us from disgrace in this world and punishment in the Hereafter."}, {"id": "d76", "n": "76", "d": "sun", "t": "Preservation in Islam and Allah’s abundant good", "e": "O Allah, preserve me in Islam while standing, preserve me in Islam while sitting, and preserve me in Islam while lying down. Do not give any enemy or envious person cause to rejoice at my misfortune. O Allah, I ask You for every good whose treasures are in Your hand, and I ask You for the good that is entirely in Your hand."}, {"id": "d77", "n": "77", "d": "sun", "t": "Forgiveness, relief, debt and every need", "e": "O Allah, leave no sin of ours unforgiven, no worry unrelieved, no debt unpaid, and no need of this world or the Hereafter unfulfilled, O Most Merciful of those who show mercy."}, {"id": "d78", "n": "78", "d": "sun", "t": "Help in remembrance, gratitude and worship", "e": "O Allah, help us to remember You, give thanks to You and worship You well."}, {"id": "d79", "n": "79", "d": "sun", "t": "Contentment, blessing and care for what is absent", "e": "O Allah, make me content with what You have provided for me, bless it for me, and take good care of all that is absent from me."}, {"id": "d80", "n": "80", "d": "sun", "t": "A pure life, good death and honourable return", "e": "O Allah, I ask You for a pure life, a good death and a return free from disgrace and humiliation."}, {"id": "d81", "n": "81", "d": "sun", "t": "Strength in weakness and honour through Islam", "e": "O Allah, I am weak, so strengthen my weakness in seeking Your pleasure. Take me by the forelock towards good, and make Islam the utmost object of my contentment. I am lowly, so grant me honour; I am in need, so provide for me."}, {"id": "d82", "n": "82", "d": "sun", "t": "The best of life, deeds and the Hereafter", "e": "O Allah, I ask You for the best requests, the best supplications, the best success, the best deeds, the best reward, the best life and the best death. Make me steadfast, make my scales heavy with good deeds, make my faith firm, raise my rank and accept my prayer. I ask You for the highest ranks of Paradise. Amin. O Allah, I ask You for the beginnings and endings of good, for all that it encompasses, its first and its last, its outward and its inward aspects. O Allah, I ask You for the good of what I undertake, the good of what I do, the good of what I carry out, and the good of what is hidden and what is apparent."}, {"id": "d83", "n": "83", "d": "sun", "t": "Abundant provision in old age", "e": "O Allah, make Your provision for me most abundant in my old age and at the close of my life."}, {"id": "d84", "n": "84", "d": "sun", "t": "A good end and steadfastness until meeting Allah", "e": "Make the last part of my life its best part, the closing deeds of my life my best deeds, and the day I meet You the best of my days. O Guardian of Islam and its people, keep me steadfast in it until I meet You. I ask You [for forgiveness] for myself and those connected to me."}, {"id": "d85", "n": "85", "d": "sun", "t": "Protection from affliction, misguidance and a harmful death", "e": "O Allah, I seek refuge in You from an evil life and trials of the heart. I seek refuge in Your might—there is no god but You—from Your letting me go astray, from severe affliction, the depths of misery, an adverse decree and the gloating of enemies; from the evil of what I have done and what I have not done; from the evil of what I know and what I do not know; from the loss of Your blessings, the withdrawal of the well-being You grant, the sudden onset of Your punishment and all Your displeasure; from the evil of my hearing, my sight, my tongue, my heart and my semen; from destitution, from wronging others or being wronged, from a collapse falling upon me, from falling from a height, from drowning and burning; from Satan confounding me at the time of death; from dying while fleeing battle in Your cause; and from dying of a venomous bite."}, {"id": "d86", "n": "86", "d": "mon", "t": "Patience, gratitude and humility", "e": "O Allah, make me patient and make me grateful. Make me small in my own eyes and great in the eyes of others."}, {"id": "d87", "n": "87", "d": "mon", "t": "Blessings and contentment", "e": "O Allah, place in our land its blessing, its beauty and its tranquillity. Do not deprive me of the blessing of what You have given me, and do not put me to trial through what You have withheld from me."}, {"id": "d88", "n": "88", "d": "mon", "t": "Beautiful character and a peaceful heart", "e": "O Allah, You have made my appearance beautiful, so make my character beautiful too. Remove the anger from my heart and protect me from trials that lead astray, for as long as You keep us alive."}, {"id": "d89", "n": "89", "d": "mon", "t": "Faith at death", "e": "O Allah, prompt me with the testimony of faith at the time of death."}, {"id": "d90", "n": "90", "d": "mon", "t": "Goodness of today and what follows", "e": "My Lord, I ask You for the good of this day and the good that comes after it."}, {"id": "d91", "n": "91", "d": "mon", "t": "Goodness of the day", "e": "O Allah, I ask You for the good of this day, its triumph, its victory, its light, its blessing and its guidance."}, {"id": "d92", "n": "92", "d": "mon", "t": "Pardon and protection on every side", "e": "O Allah, I ask You for pardon and well-being in my religion, my worldly life, my family and my wealth. O Allah, cover my faults and replace my fear with security. O Allah, protect me from before me, from behind me, from my right, from my left and from above me. I seek refuge in Your greatness from being overtaken from beneath me."}, {"id": "d93", "n": "93", "d": "mon", "t": "Mercy and putting affairs right", "e": "O Ever-Living, O Sustainer of all, by Your mercy I seek help. Set right for me all my affairs, and do not leave me to myself even for the blink of an eye."}, {"id": "d94", "n": "94", "d": "mon", "t": "Divine light and protection from the Fire", "e": "I ask You by the light of Your countenance, through which the heavens and the earth shine, by every right that belongs to You, and by the right that those who ask have with You, that You pardon me and, by Your power, grant me refuge from the Fire."}, {"id": "d95", "n": "95", "d": "mon", "t": "A day of goodness", "e": "O Allah, make the beginning of this day good, its middle prosperous and its end successful. I ask You for the good of this world and the Hereafter, O Most Merciful of those who show mercy."}, {"id": "d96", "n": "96", "d": "mon", "t": "Forgiveness and a place in the highest assembly", "e": "O Allah, forgive my sin, drive away my devil, release me from my bonds, make my scale heavy and place me in the highest assembly."}, {"id": "d97", "n": "97", "d": "mon", "t": "Protection on the Resurrection Day", "e": "O Allah, protect me from Your punishment on the day You raise Your servants."}, {"id": "d98", "n": "98", "d": "mon", "t": "Refuge from all harmful creatures", "e": "O Allah, Lord of the seven heavens and all they cover, Lord of the earths and all they bear, and Lord of the devils and all they have led astray: be my Protector from the evil of all Your creation, lest any of them wrong me or transgress against me. Mighty is the one whom You protect, and blessed is Your name."}, {"id": "d99", "n": "99", "d": "mon", "t": "Forgiveness and mercy upon waking", "e": "There is no god but You; You have no partner. Glory be to You. O Allah, I seek Your forgiveness for my sin and ask You for Your mercy."}, {"id": "d100", "n": "100", "d": "mon", "t": "Forgiveness, a spacious home and blessed provision", "e": "O Allah, forgive my sin, make my home spacious for me, and bless my provision."}, {"id": "d101", "n": "101", "d": "mon", "t": "Repentance and purity", "e": "O Allah, make me among those who repent often, and make me among those who keep themselves pure."}, {"id": "d102", "n": "102", "d": "mon", "t": "Forgiveness, provision and guidance to truth", "e": "O Allah, forgive me, guide me, provide for me and grant me well-being. By Your permission, guide me to the truth concerning that over which there is disagreement."}, {"id": "d103", "n": "103", "d": "mon", "t": "Light within and around us", "e": "O Allah, place light in my heart, light in my sight, light in my hearing, light to my right, light to my left, light behind me, and before me light. Grant me light, and place light in my sinews, light in my flesh, light in my blood, light in my hair, light in my skin and light in my tongue. Place light within me, make my light great, and make me light. Place light above me and light below me. O Allah, grant me light."}, {"id": "d104", "n": "104", "d": "mon", "t": "Doors of mercy and provision", "e": "O Allah, open for us the doors of Your mercy, and make the doors of Your provision easy for us to enter."}, {"id": "d105", "n": "105", "d": "mon", "t": "Protection from Satan", "e": "O Allah, protect me from Satan."}, {"id": "d106", "n": "106", "d": "mon", "t": "Asking Allah for His bounty", "e": "O Allah, I ask You for Your bounty."}, {"id": "d107", "n": "107", "d": "mon", "t": "Revival and righteous conduct", "e": "O Allah, forgive all my faults and sins. O Allah, uplift me, keep me alive, provide for me, and guide me to good deeds and good character. None guides to their goodness or turns away their evil except You."}, {"id": "d108", "n": "108", "d": "mon", "t": "Wholesome provision, useful knowledge and accepted deeds", "e": "O Allah, I ask You for wholesome provision, beneficial knowledge, and deeds that are accepted."}, {"id": "d109", "n": "109", "d": "mon", "t": "Relief from sorrow through the Quran", "e": "O Allah, I am Your servant, the son of Your servant and the son of Your female servant. My forelock is in Your hand. Your command over me is carried out, and Your judgement concerning me is just. I ask You by every name that is Yours: a name by which You have named Yourself, or which You have sent down in Your Book, or taught to any of Your creation, or kept with Yourself in the knowledge of the unseen: make the magnificent Qur'an the springtime of my heart, the light of my sight, the clearing away of my sorrow, and the removal of my worry."}, {"id": "d110", "n": "110", "d": "mon", "t": "Protection from overpowering harm", "e": "O Allah, God of Jibril, Mika'il and Israfil, and God of Ibrahim, Isma'il and Ishaq: grant me well-being, and do not give any of Your creation power over me with something I do not have the strength to bear."}, {"id": "d111", "n": "111", "d": "mon", "t": "Lawful provision and freedom from debt", "e": "O Allah, suffice me with what You have made lawful so that I have no need of what You have forbidden, and by Your bounty make me independent of all besides You."}, {"id": "d112", "n": "112", "d": "mon", "t": "Humble pleading and the prayer of Taif", "e": "O Allah, You hear my words, see where I am, and know what I conceal and what I reveal. Nothing of my affairs is hidden from You. I am afflicted and needy, crying for help and seeking refuge, fearful and apprehensive, acknowledging and confessing my sin. I ask You as a destitute person asks, and I implore You as a humbled sinner implores. I call upon You as one who is fearful and afflicted, and as one whose neck is bowed before You, whose tears flow for You, whose body is humbled before You, and whose nose is lowered in submission to You. O Allah, do not leave me disappointed in calling upon You. Be compassionate and merciful to me, O best of those who are asked, and O best of those who give! O Allah, to You I complain of my weakness, my lack of means, and my low standing in people's eyes. O Most Merciful of those who show mercy, to whom do You entrust me? To an enemy who attacks me, or to someone close to me whom You have given control over my affairs? If You are not displeased with me, I do not mind; yet the well-being You grant is more ample for me."}, {"id": "d113", "n": "113", "d": "mon", "t": "Tender and returning hearts", "e": "O Allah, we ask You for hearts that are deeply responsive, humble, and constantly turning back to You in Your path."}, {"id": "d114", "n": "114", "d": "mon", "t": "Living faith and contentment with destiny", "e": "O Allah, I ask You for faith that takes root in my heart, and for true certainty, so that I know that nothing can befall me except what You have written for me. Grant me contentment with the livelihood You have allotted to me."}, {"id": "d115", "n": "115", "d": "mon", "t": "Praise beyond our words", "e": "O Allah, all praise belongs to You, as You Yourself say, and better than anything we say."}, {"id": "d116", "n": "116", "d": "mon", "t": "Protection from moral evils and trials", "e": "O Allah, I seek refuge in You from blameworthy character, deeds, desires and illnesses. We seek refuge in You from every evil from which Your Prophet Muhammad, may Allah bless him and grant him peace, sought refuge; from a bad neighbour in a permanent dwelling, for a neighbour in the desert moves away; from an enemy's domination and the gloating of enemies; from hunger, for it is a wretched bedfellow; and from treachery, for it is a wretched inner companion; from turning back on our heels or being drawn away from our religion; from trials, both those that are apparent and those that are hidden; from a bad day, a bad night, a bad hour and a bad companion."}, {"id": "d117", "n": "117", "d": "tue", "t": "Life and worship for Allah", "e": "O Allah, my prayer, my worship, my life and my death are for You. To You is my return, and to You, my Lord, belongs all that I leave behind."}, {"id": "d118", "n": "118", "d": "tue", "t": "Goodness brought by the winds", "e": "O Allah, I ask You for the good of what the winds bring."}, {"id": "d119", "n": "119", "d": "tue", "t": "Gratitude, remembrance and surrendered hearts", "e": "O Allah, make me give You abundant thanks, remember You often, follow Your counsel and keep Your instructions. O Allah, our hearts, our forelocks and our limbs are in Your hand; You have not given us control over any of them. Since You have made us so, be our Guardian and guide us to the straight path."}, {"id": "d120", "n": "120", "d": "tue", "t": "Love of Allah and longing to meet Him", "e": "O Allah, make love for You the dearest of all things to me, and make fear of You greater to me than every other fear. Free me from worldly needs through longing to meet You. And when You bring comfort to the eyes of worldly people through their worldly life, bring comfort to my eyes through worshipping You."}, {"id": "d121", "n": "121", "d": "tue", "t": "Health, chastity and trustworthiness", "e": "O Allah, I ask You for good health, chastity, trustworthiness, good character and contentment with Your decree."}, {"id": "d122", "n": "122", "d": "tue", "t": "Thanksgiving, trust and good expectations", "e": "O Allah, to You belongs praise in gratitude, and Yours is the favour freely bestowed. O Allah, I ask You to enable me to do the deeds You love, to rely upon You sincerely and to think well of You."}, {"id": "d123", "n": "123", "d": "tue", "t": "A heart receptive to remembrance", "e": "O Allah, open the ears of my heart to Your remembrance. Grant me obedience to You and to Your Messenger, and the ability to act upon Your Book."}, {"id": "d124", "n": "124", "d": "tue", "t": "Reverence and happiness through obedience", "e": "O Allah, make me fear You as though I see You, always, until I meet You. Make me fortunate through mindfulness of You, and do not make me wretched through disobedience to You."}, {"id": "d125", "n": "125", "d": "tue", "t": "Ease, well-being and pardon", "e": "O Allah, be gracious to me by making every difficulty easy, for making every difficulty easy is easy for You. I ask You for ease and well-being in this world and the Hereafter. O Allah, pardon me, for You are Most Pardoning, Most Generous."}, {"id": "d126", "n": "126", "d": "tue", "t": "Purity of heart, action, tongue and gaze", "e": "O Allah, purify my heart of hypocrisy, my deeds of showing off, my tongue of lying and my eyes of treachery. You know the furtive glances of the eyes and what the hearts conceal."}, {"id": "d127", "n": "127", "d": "tue", "t": "Tears of reverent fear", "e": "O Allah, grant me two eyes that weep abundantly, soothing the heart with tears shed in fear of You, before the tears turn to blood and the molars to burning embers."}, {"id": "d128", "n": "128", "d": "tue", "t": "Well-being and a good final deed", "e": "O Allah, grant me well-being through Your power and admit me into Your mercy. Let my allotted life pass in obedience to You, make my final deed my best deed, and make Paradise its reward."}, {"id": "d129", "n": "129", "d": "tue", "t": "Relief from distress and need", "e": "O Allah, Reliever of anxiety, Remover of sorrow, Answerer of the prayers of the distressed, Most Compassionate and Merciful in this world: You show me mercy, so have mercy on me with a mercy through which You make me independent of the mercy of anyone besides You."}, {"id": "d130", "n": "130", "d": "tue", "t": "Unexpected good and protection from sudden evil", "e": "O Allah, I ask You for unexpected good, and I seek refuge in You from sudden evil."}, {"id": "d131", "n": "131", "d": "tue", "t": "Peace and acceptance of prayer", "e": "O Allah, You are Peace, from You is peace, and to You peace returns. I ask You, O Possessor of Majesty and Honour, to answer our prayer, grant us what we desire, and make us independent of those of Your creation whom You have made independent of us."}, {"id": "d132", "n": "132", "d": "tue", "t": "Asking Allah to choose well", "e": "O Allah, choose what is best for me and make the choice for me."}, {"id": "d133", "n": "133", "d": "tue", "t": "Contentment with Allah’s timing", "e": "O Allah, make me content with Your decree and bless what has been ordained for me, so that I do not wish to hasten what You have delayed or delay what You have hastened."}, {"id": "d134", "n": "134", "d": "tue", "t": "The life of the Hereafter", "e": "O Allah, there is no true life of bliss except the life of the Hereafter."}, {"id": "d135", "n": "135", "d": "tue", "t": "Living humbly among the needy", "e": "O Allah, let me live humbly, let me die humbly, and gather me among the humble."}, {"id": "d136", "n": "136", "d": "tue", "t": "Joy in good and repentance after wrong", "e": "O Allah, make me one of those who rejoice when they do good and seek forgiveness when they do wrong."}, {"id": "d137", "n": "137", "d": "tue", "t": "Mercy that puts life in order", "e": "O Allah, I ask You for a mercy from You by which You guide my heart, bring order to my affairs, mend my scattered state, set right my religion, settle my debts, protect what is absent from me, raise what is present with me, brighten my face, purify my deeds, inspire me with right guidance and restore harmony in my life, and through it protect me from every evil."}, {"id": "d138", "n": "138", "d": "tue", "t": "Steadfast faith and divine honour", "e": "O Allah, grant me faith that does not turn back, certainty after which there is no disbelief, and mercy through which I may attain the honour of Your generosity in this world and the Hereafter."}, {"id": "d139", "n": "139", "d": "tue", "t": "Success and the company of the righteous", "e": "O Allah, I ask You for success in what is decreed, the hospitality granted to martyrs, the life of the blessed, companionship of the prophets, and victory over enemies. Truly, You hear supplication."}, {"id": "d140", "n": "140", "d": "tue", "t": "Good beyond our understanding", "e": "O Allah, whatever good You have promised anyone in Your creation, or will grant to any of Your servants, that my understanding falls short of, my deeds are too weak to attain, and my wishes and requests have not reached: I turn to You in longing for it and ask You for it by Your mercy, O Lord of all worlds."}, {"id": "d141", "n": "141", "d": "tue", "t": "Entrusting our needs to Allah", "e": "O Allah, I lay my need before You. Though my understanding is limited and my deeds are weak, I am in need of Your mercy. I ask You, O Fulfiller of affairs and Healer of hearts: just as You keep the seas apart, protect me from the punishment of the blazing Fire, from the cry for destruction, and from the trial of the graves."}, {"id": "d142", "n": "142", "d": "tue", "t": "Safety on the Day of Warning", "e": "O Allah, whose bond is firm and whose command is right, I ask You for safety on the Day of Warning, and for Paradise on the Day of Eternity, together with those brought near to You: those who are present before You, who bow and prostrate, and who fulfil their covenants. Truly, You are merciful and loving, and You do whatever You will."}, {"id": "d143", "n": "143", "d": "tue", "t": "Guidance and loyalty to Allah", "e": "O Allah, make us guides who are rightly guided, neither astray nor leading others astray, at peace with Your friends and at war with Your enemies. Through love of You, may we love those who love You; and in enmity towards Your enemies, may we oppose those among Your creation who disobey You."}, {"id": "d144", "n": "144", "d": "tue", "t": "Reliance after supplication", "e": "O Allah, this is our supplication, and Yours is to answer. This is our effort, and upon You is our reliance. O Allah, do not leave me to my own self even for the blink of an eye, and do not take away from me the good You have granted me."}, {"id": "d145", "n": "145", "d": "tue", "t": "The eternal Lord without partner", "e": "O Allah, You are not a god we have brought into being, nor a lord we have invented whose remembrance fades away. You have no partners who share in Your judgement. Before You, we had no god to whom we could turn for refuge and abandon You. Nor has anyone helped You to create us, that we should associate him with You. Blessed and exalted are You. We ask You—there is no god but You—to forgive me."}, {"id": "d146", "n": "146", "d": "tue", "t": "Entrusting the soul at bedtime", "e": "O Allah, You created my soul, and You will take it in death. Its death and its life belong to You. If You keep it alive, protect it with the protection You give Your righteous servants. If You cause it to die, forgive it and have mercy on it."}, {"id": "d147", "n": "147", "d": "tue", "t": "Knowledge, forbearance and well-being", "e": "O Allah, help me through knowledge, adorn me with forbearance, honour me with piety, and beautify me with well-being."}, {"id": "d148", "n": "148", "d": "tue", "t": "A time that honours knowledge and forbearance", "e": "O Allah, may I not live to see a time, nor may these people reach a time, when the learned are not followed and the forbearing are not treated with respect. Their hearts are those of non-Arabs, while their tongues are those of Arabs."}, {"id": "d149", "n": "149", "d": "tue", "t": "Mercy for anyone harmed", "e": "O Allah, I take from You a pledge that You will never break with me. I am only human: whichever believer I have hurt, insulted, or struck, or cursed, make it a blessing, a purification, and a means of nearness by which You bring him close to You."}, {"id": "d150", "n": "150", "d": "tue", "t": "Comprehensive refuge from harm and the Fire", "e": "O Allah, I seek refuge in You from leucoderma, discord, hypocrisy, bad character, and the evil of all that You know. I seek refuge in Allah from the condition of the people of the Fire, from the Fire itself, and from any word or deed that brings one close to it; and from the evil of everything whose forelock You hold. I seek refuge in You from the evil of this day and the evil that comes after it; from the evil of my own self, the evil of Satan and his enticement to associate partners with You; from our bringing evil upon ourselves or upon another Muslim; from my committing an error or sin that You do not forgive; and from the distress of standing on the Day of Resurrection."}, {"id": "d151", "n": "151", "d": "wed", "t": "Chastity and ease", "e": "O Allah, guard my chastity and make my affairs easy."}, {"id": "d152", "n": "152", "d": "wed", "t": "Completeness in worship", "e": "O Allah, I ask You for completeness in ablution and prayer, the fullness of Your pleasure, and the fullness of Your forgiveness."}, {"id": "d153", "n": "153", "d": "wed", "t": "Receiving the record in the right hand", "e": "O Allah, place my record of deeds in my right hand."}, {"id": "d154", "n": "154", "d": "wed", "t": "Mercy and protection from punishment", "e": "O Allah, cover me with Your mercy and keep me away from Your punishment."}, {"id": "d155", "n": "155", "d": "wed", "t": "Firm feet on the Day of Judgement", "e": "O Allah, keep my feet firm on the day when feet will slip."}, {"id": "d156", "n": "156", "d": "wed", "t": "Success", "e": "O Allah, make us successful."}, {"id": "d157", "n": "157", "d": "wed", "t": "Opening the heart to remembrance", "e": "O Allah, open the locks of our hearts through Your remembrance, complete Your blessing upon us, shower us with Your bounty, and make us among Your righteous servants."}, {"id": "d158", "n": "158", "d": "wed", "t": "The best gift given to the righteous", "e": "O Allah, grant me the best of what You grant Your righteous servants."}, {"id": "d159", "n": "159", "d": "wed", "t": "Living and dying as a Muslim", "e": "O Allah, let me live as a Muslim and let me die as a Muslim."}, {"id": "d160", "n": "160", "d": "wed", "t": "Protection against hostile unbelief", "e": "O Allah, punish the disbelievers, cast fear into their hearts, divide their counsels, and send down Your wrath and punishment upon them. O Allah, punish the disbelievers among the People of the Book and the polytheists who reject Your signs, deny Your messengers, turn others away from Your path, transgress Your limits, and call upon another god alongside You. There is no god but You. Blessed are You, and exalted far above what the wrongdoers say."}, {"id": "d161", "n": "161", "d": "wed", "t": "Forgiveness, unity and sincere worship", "e": "O Allah, forgive me and all believing men and women, and all Muslim men and women. Set them right, reconcile them with one another, and unite their hearts in love. Place faith and wisdom in their hearts, keep them firm upon the religion of Your Messenger, and inspire them to give thanks for the blessing You have bestowed upon them, and to fulfil the covenant You have made with them. Grant them victory over Your enemy and theirs. O God of Truth, glory be to You; there is no god besides You. Forgive my sin and set right my deeds. You forgive the sins of whomever You will, and You are the Most Forgiving, the Most Merciful. O All-Forgiving, forgive me; O Accepter of Repentance, turn towards me in forgiveness; O Most Compassionate, have mercy on me; O Most Pardoning, pardon me; O Most Kind, show me kindness. O my Lord, inspire me to give thanks for the blessing You have bestowed upon me, and give me strength to worship You well. O my Lord, I ask You for every good. O my Lord, grant me a good beginning and a good ending, and protect me from evil deeds. Whoever You protect from evil deeds on that Day, You have shown him mercy; and that is the supreme success."}, {"id": "d162", "n": "162", "d": "wed", "t": "All praise and every good", "e": "O Allah, all praise belongs to You, all thanks belong to You, all sovereignty belongs to You, and all creation belongs to You. In Your hand is all good, and to You all affairs return. I ask You for every good and seek refuge in You from every evil."}, {"id": "d163", "n": "163", "d": "wed", "t": "Relief from distress and confession", "e": "In the name of Allah, besides whom there is no god. O Allah, remove distress and sorrow from me. O Allah, I go forth praising You, and I acknowledge my sin."}, {"id": "d164", "n": "164", "d": "wed", "t": "Mercy, steadfast faith and relief from poverty", "e": "O Allah, my God and the God of Ibrahim, Ishaq and Yaqub, and the God of Jibril, Mikail and Israfil, I ask You to answer my prayer, for I am in distress; preserve me in my religion, for I am being tested; reach me with Your mercy, for I am sinful; and drive poverty away from me, for I am needy."}, {"id": "d165", "n": "165", "d": "wed", "t": "Sharing in righteous supplications", "e": "O Allah, I ask You by the right of those who ask of You, for the one who asks has a right upon You: whenever You have accepted the supplications and answered the prayers of any male or female servant on land or sea, include us in the good for which they call upon You, and include them in the good for which we pray to You; grant us and them well-being; accept from us and from them; and pardon us and them. We have believed in what You have revealed and followed the Messenger, so record us among those who bear witness."}, {"id": "d166", "n": "166", "d": "wed", "t": "The Prophet's rank and intercession", "e": "O Allah, grant Muhammad the station of Wasilah. Place love for him among the chosen, his rank among the highest, and his remembrance among those brought near to You."}, {"id": "d167", "n": "167", "d": "wed", "t": "Guidance, bounty and blessings", "e": "O Allah, grant me guidance from You. Pour Your bounty upon me, bestow Your mercy upon me in full, and send Your blessings down upon me."}, {"id": "d168", "n": "168", "d": "wed", "t": "Forgiveness, mercy and repentance", "e": "O Allah, forgive me, have mercy on me and accept my repentance. Truly, You are the Acceptor of repentance, the Most Merciful."}, {"id": "d169", "n": "169", "d": "wed", "t": "The qualities of the righteous", "e": "O Allah, I ask You for the enabling grace of the rightly guided, the deeds of those who have certainty, the sincerity of the repentant, the resolve of the patient, the striving of those who fear You, and the seeking of those who long for You, the worship of the scrupulously pious, and the understanding of those with knowledge, until I meet You."}, {"id": "d170", "n": "170", "d": "wed", "t": "Reverence, sincerity and a prepared death", "e": "O Allah, I ask You for a fear that keeps me from disobeying You, so that I may obey You with deeds that merit Your pleasure; turn to You in sincere repentance out of fear of You; devote myself sincerely to You out of shame before You; and place my trust in You in all affairs, and think well of You. Glory be to the Creator of light. O Allah, do not destroy us suddenly, do not seize us unexpectedly, and do not make us heedless of any duty or instruction."}, {"id": "d171", "n": "171", "d": "wed", "t": "Solace in the grave and mercy through the Quran", "e": "O Allah, comfort me in the loneliness of my grave. O Allah, have mercy on me through the mighty Quran, and make it a guide, a light, guidance and mercy for me. O Allah, remind me of what I have forgotten of it, teach me what I do not know of it, and grant me its recitation during the hours of the night and the hours of the day. Make it a proof in my favour, O Lord of all worlds."}, {"id": "d172", "n": "172", "d": "wed", "t": "Confession and refuge from the Fire", "e": "O Allah, I am Your servant, the son of Your servant and the son of Your maidservant. My forelock is in Your hand, and I move within Your grasp. I affirm that I will meet You and believe in Your promise. You commanded me, but I disobeyed; You forbade me, but I committed what You forbade. This is the place of one seeking refuge in You from the Fire. There is no god but You. Glory be to You. I have wronged myself, so forgive me, for no one forgives sins except You."}, {"id": "d173", "n": "173", "d": "wed", "t": "Praise and reliance on Allah", "e": "O Allah, all praise belongs to You. To You we bring our complaint; in You we seek deliverance, and You are the One from whom help is sought. There is no power and no strength except through Allah."}, {"id": "d174", "n": "174", "d": "wed", "t": "Refuge from anger, error and harm", "e": "O Allah, I seek refuge in Your pleasure from Your displeasure, and in Your pardon from Your punishment. I seek refuge in You from You. I cannot fully praise You; You are as You have praised Yourself. O Allah, we seek refuge in You from slipping or being made to slip, from going astray or being led astray, from wronging others or being wronged by others; from acting foolishly or being treated foolishly; and from my going astray or being led astray. I seek refuge in the light of Your noble Face, through which the heavens are illuminated, the darkness is illuminated, and the affairs of this world and the Hereafter are set right, from Your bringing Your anger down upon me or sending Your displeasure upon me. To You I turn for reconciliation until You are pleased. There is no power and no strength except through You. O Allah, grant me protective care like the care given to a small child. O Allah, I seek refuge in You from the evil of the two blind forces: the flood and the charging camel."}, {"id": "d175", "n": "175", "d": "thu", "t": "The Quran in heart and life", "e": "O Allah, I ask You by Muhammad, Your Prophet; Ibrahim, Your close friend; Musa, Your confidant; and Isa, Your spirit and Your word; and by the revelation given to Musa, the Gospel of Isa, the Psalms of Dawud, and the Criterion revealed to Muhammad, may Allah bless him and grant him peace; and by every revelation You have sent down, or any decree You have ordained, any petitioner You have given to, any poor person You have enriched, any rich person You have impoverished, or anyone astray whom You have guided. I ask You by Your name which You placed upon the earth so that it became firm, upon the heavens so that they were raised, and upon the mountains so that they stood firm. I ask You by Your name through which Your Throne became established. I ask You by Your pure, purified name, sent down in Your Book from Your presence; and by Your name which You placed upon the day so that it became light, and upon the night so that it became dark; and by Your greatness, Your majesty and the light of Your countenance: grant me the mighty Quran, mingle it with my flesh, my blood, my hearing and my sight, and make my body act according to it, through Your strength and power. There is no strength and no power except through You. O Allah, do not let us feel secure from Your hidden plan, nor make us forget Your remembrance. Do not remove Your covering from us, and do not make us among the heedless."}, {"id": "d176", "n": "176", "d": "thu", "t": "Well-being and relief in helplessness", "e": "O Allah, I ask You to hasten Your granting of well-being, to avert Your affliction, and to let me depart from this world into Your mercy. O You who suffice in place of everyone, while no one can suffice in Your place; O only One for those who have no one; O support of those who have no support: all hope has ended except hope in You. Deliver me from the state I am in, and help me against what has befallen me, by the honour of Your noble countenance and by Muhammad's right upon You. Ameen."}, {"id": "d177", "n": "177", "d": "thu", "t": "Protection and gratitude despite shortcomings", "e": "O Allah, guard me with Your eye that never sleeps, shelter me by Your might that cannot be assailed, and have mercy on me through Your power over me, so that I do not perish while You are my hope. How many blessings You have bestowed upon me for which my gratitude to You has been small; and how many trials You have tested me with in which my patience before You has been small. O You who did not deprive me when my gratitude for Your blessing was small; O You who did not abandon me when my patience under Your trial was small; O You who saw me committing sins and did not expose me."}, {"id": "d178", "n": "178",
