 "d": "thu", "t": "Unending favour and protection from oppressors", "e": "O Bestower of goodness that never ends; O Possessor of blessings that can never be counted: I ask You to send blessings upon Muhammad and upon the family of Muhammad. And through You I confront the enemies and the tyrants."}, {"id": "d179", "n": "179", "d": "thu", "t": "Faith, provision and enduring well-being", "e": "O Allah, make worldly means a help to me in my religion, and make piety a help to me for my Hereafter. Guard for me what I am absent from, and do not leave me to myself in what I am present for. O You whom sins cannot harm and whom forgiveness cannot diminish, grant me what does not diminish You, and forgive me what does not harm You. You are the Bestower. I ask You for relief soon, gracious patience, abundant provision, and well-being free from every affliction. I ask You for complete well-being, lasting well-being, and gratitude for well-being. I ask You for independence from people. There is no strength and no power except through Allah, the Most High, the Most Great."}, {"id": "d180", "n": "180", "d": "thu", "t": "Integrity within and without", "e": "O Allah, make my inward state better than my outward appearance, and make my outward life righteous. O Allah, I ask You for the good things You grant people: wealth, family and children, without going astray or leading others astray."}, {"id": "d181", "n": "181", "d": "thu", "t": "Acceptance and a tranquil soul", "e": "O Allah, make us among Your chosen servants, with radiant faces and limbs, received as an accepted delegation. O Allah, I ask You for a soul at peace with You, believing in the meeting with You, content with Your decree, and satisfied with Your gifts."}, {"id": "d182", "n": "182", "d": "thu", "t": "Lasting praise and steadiness", "e": "O Allah, to You belongs praise: praise lasting as long as You endure. To You belongs praise: praise eternal with Your eternity. To You belongs praise: praise that has no end except by Your will. To You belongs praise: praise whose speaker seeks only Your pleasure. To You belongs praise at every blink of an eye and every breath of every soul. O Allah, turn my heart towards Your religion, and guard us from behind by Your mercy. O Allah, keep me firm lest I stumble, and guide me lest I go astray."}, {"id": "d183", "n": "183", "d": "thu", "t": "Protection of the heart and inward sufficiency", "e": "O Allah, just as You stand between me and my heart, stand between me and Satan and his work. O Allah, provide for us from Your bounty, do not deprive us of Your gifts, and bless what You have provided for us. Place our wealth within our souls, and direct our longing towards what is with You."}, {"id": "d184", "n": "184", "d": "thu", "t": "Trust, guidance and divine help", "e": "O Allah, make me among those who trust in You and for whom You are sufficient; who seek Your guidance and whom You guide; and who seek Your help and whom You help."}, {"id": "d185", "n": "185", "d": "thu", "t": "A heart occupied with remembrance", "e": "O Allah, turn the thoughts of my heart towards fear of You and remembrance of You. Direct my concern and desire towards what You love and are pleased with. O Allah, whatever ease or hardship You test me with, keep me firmly attached to the way of truth and the law of Islam."}, {"id": "d186", "n": "186", "d": "thu", "t": "Complete blessings and gratitude", "e": "O Allah, I ask You for the completion of Your blessings in all things, and for gratitude to You for them until You are pleased and after You are pleased; for the best choice in every matter in which there is a choice; and for ease in all affairs, without their hardship, O Generous One."}, {"id": "d187", "n": "187", "d": "thu", "t": "Strength for striving in God’s cause", "e": "O Allah, Cleaver of the dawn, Maker of the night for rest, and of the sun and moon for reckoning, strengthen me for striving in Your path."}, {"id": "d188", "n": "188", "d": "thu", "t": "Praise for God’s care and gifts", "e": "O Allah, to You belongs praise for Your trials and Your dealings with Your creation. To You belongs praise for Your trials and Your dealings with the members of our households. To You belongs praise for Your trials and Your dealings with our own selves in particular. To You belongs praise for guiding us, praise for honouring us, praise for concealing our faults, and praise for the Quran. To You belongs praise for family and wealth, and to You belongs praise for well-being. To You belongs praise until You are pleased, and to You belongs praise when You are pleased, O You who are worthy of being feared and who alone grant forgiveness."}, {"id": "d189", "n": "189", "d": "thu", "t": "Success in what pleases God", "e": "O Allah, grant me success in what You love and are pleased with: in speech, work, action, intention and conduct. You have power over all things."}, {"id": "d190", "n": "190", "d": "thu", "t": "Protection from harmful company and distress", "e": "O Allah, I seek refuge in You from a deceitful intimate friend whose eyes watch me while his heart lies in wait to harm me. If he sees a good deed, he conceals it; and if he sees a bad deed, he spreads it. O Allah, I seek refuge in You from poverty and severe hardship. O Allah, I seek refuge in You from Iblis and his armies. O Allah, I seek refuge in You from the temptation of women. O Allah, I seek refuge in You from Your turning Your face away from me on the Day of Resurrection. O Allah, I seek refuge in You from every deed that disgraces me, and I seek refuge in You from every companion who harms me, every hope that distracts me, every poverty that makes me forget, and every wealth that makes me transgress. O Allah, I seek refuge in You from death through worry, and I seek refuge in You from death through grief."}, {"id": "d191", "n": "191", "d": "fri", "t": "Relief and renewal through the Quran", "e": "O my Lord, O my Lord, O my Lord! O Allah, O Great One, O All-Hearing, O All-Seeing, O You who have neither partner nor minister; O Creator of the sun and the shining moon; O Protector of the distressed, the fearful and the one seeking refuge; O Provider for the small child; O Mender of the broken bone: I call upon You with the plea of one distressed and poor, like the plea of one desperate and afflicted. I ask You by the places of might in Your Throne, by the keys of mercy in Your Book, and by the eight names written upon the sun's horn, to make the Quran the spring of my heart and the clearing of my sorrow."}, {"id": "d192", "n": "192", "d": "fri", "t": "Every need laid before Allah", "e": "Our Lord, grant us such and such in this world. O Comforter of every lonely one, O Companion of everyone who is alone, O Near One who is never far, O Witness who is never absent, O Victor who is never overcome; O Ever-Living, O Sustainer, O Possessor of majesty and honour; O Light of the heavens and the earth, O Adornment of the heavens and the earth, O Pillar of the heavens and the earth, O Originator of the heavens and the earth; O Upholder of the heavens and the earth, O Possessor of majesty and honour, O Responder to those who cry for help, O Final Refuge of those who seek protection, O Reliever of the distressed, O Comforter of the sorrowful, O Answerer of the prayers of the desperate, O Remover of anguish, O God of all worlds, O Most Merciful of the merciful: every need is laid before You."}, {"id": "d193", "n": "193", "d": "fri", "t": "Mercy, character and divine help", "e": "O Allah, You are the mighty Creator. You are All-Hearing, All-Knowing. You are Most Forgiving, Most Merciful. You are Lord of the mighty Throne. O Allah, You are the Beneficent, the Bountiful, the Generous. Forgive me, have mercy on me, grant me well-being, provide for me, cover my faults, mend my shortcomings, raise me, guide me, and do not let me go astray. Admit me to Paradise through Your mercy, O Most Merciful of the merciful. Make me beloved to You, my Lord; make me humble before You within myself; and in the eyes of people, honour me. Keep me away from bad character. O Allah, You have asked of our souls what we possess no power over except through You. Grant us of it that which makes You pleased with us."}, {"id": "d193a", "n": "193(a)", "d": "fri", "t": "Lasting faith and well-being", "e": "O Allah, I ask You for lasting faith. I ask You for a humble heart. I ask You for true certainty. I ask You for an upright religion, and I ask You for well-being free from every affliction. I ask You for lasting well-being, gratitude for well-being, and independence from people."}, {"id": "d193b", "n": "193(b)", "d": "fri", "t": "Forgiveness for repeated faults", "e": "O Allah, I ask Your forgiveness for the sins from which I repented to You but to which I then returned. I ask Your forgiveness for the pledge I gave You concerning myself, then failed to fulfil. I ask Your forgiveness for the blessings through which I gained strength to disobey You. I ask Your forgiveness for every good deed in which I intended Your countenance, but into which something not meant for You became mixed. O Allah, do not disgrace me, for You know me well; and do not punish me, for You have power over all things."}, {"id": "d194", "n": "194*", "d": "fri", "t": "Sufficiency in pressing matters", "e": "O Allah, Lord of the seven heavens and Lord of the mighty Throne, O Allah, be sufficient for me in every pressing matter, however You will and from wherever You will."}, {"id": "d195", "n": "195", "d": "fri", "t": "Allah's sufficiency in life and the Hereafter", "e": "Allah is sufficient for me in my religion. Allah is sufficient for me in my worldly life. Allah is sufficient for me in what concerns me. Allah is sufficient for me against whoever wrongs me. Allah is sufficient for me against whoever envies me. Allah is sufficient for me against whoever plots evil against me. Allah is sufficient for me at death. Allah is sufficient for me when questioned in the grave. Allah is sufficient for me at the Scales. Allah is sufficient for me on the Bridge. Allah is sufficient for me; there is no god but Him. In Him I have placed my trust, and He is Lord of the mighty Throne."}, {"id": "d196", "n": "196", "d": "fri", "t": "The company and qualities of the righteous", "e": "O Allah, I ask You for the reward of the thankful, the hospitality granted to those brought near to You, the companionship of the prophets, the certainty of the utterly truthful, the humility of the God-fearing, and the humble devotion of those with certainty, until You cause me to die in that state, O Most Merciful of the merciful."}, {"id": "d197", "n": "197", "d": "fri", "t": "Admission to Paradise through mercy", "e": "O Allah, I ask You by Your earlier blessing upon me, by the good trial with which You have tested me, and by Your favour bestowed upon me, to admit me to Paradise through Your kindness, bounty and mercy."}, {"id": "d198", "n": "198", "d": "fri", "t": "Lasting faith and useful knowledge", "e": "O Allah, I ask You for lasting faith, sound guidance and beneficial knowledge."}, {"id": "d199", "n": "199", "d": "fri", "t": "Freedom from a wicked person's obligation", "e": "O Allah, do not let a wicked person do me a favour that I must repay in this world or the Hereafter."}, {"id": "d200", "n": "200", "d": "fri", "t": "Forgiveness, wholesome earnings and contentment", "e": "O Allah, forgive my sin, make my character generous, make my earnings wholesome, and make me content with what You have provided. Do not turn my seeking towards anything You have kept from me."}, {"id": "d201", "n": "201", "d": "fri", "t": "Protection and nearness to Allah", "e": "O Allah, I seek Your protection from every single thing You have created, and I guard myself through You against them. Grant me a place of intimacy with You, closeness to You, and a good place of return. Make me among those who fear standing before You and Your warning, and hope to meet You. Make me among those who turn to You in sincere repentance. I ask You for accepted deeds, useful knowledge, rewarded effort, and trade that will never perish."}, {"id": "d202", "n": "202", "d": "fri", "t": "Freedom from the Fire and help at death", "e": "O Allah, I ask You to free my neck from the Fire. O Allah, help me through the overwhelming pangs of death and its agonies."}, {"id": "d203", "n": "203", "d": "fri", "t": "Mercy and the highest company", "e": "O Allah, forgive me, have mercy on me, and unite me with the highest company."}, {"id": "d203a", "n": "203(a)", "d": "fri", "t": "Protection from hidden shirk and harm", "e": "O Allah, I seek refuge in You from knowingly associating anything with You, and I ask Your forgiveness for what I do not know. I seek refuge in You from a relative whose ties I have severed praying against me. O Allah, I seek refuge in You from the evil of whatever moves on its belly, the evil of whatever walks on two legs, and the evil of whatever walks on four."}, {"id": "d203b", "n": "203(b)", "d": "fri", "t": "Protection in family, faith and death", "e": "O Allah, I seek refuge in You from a wife who makes me grey before old age. I seek refuge in You from a child who becomes a burden upon me, and I seek refuge in You from wealth that becomes a punishment for me. O Allah, I seek refuge in You from doubting the truth after certainty. I seek refuge in You from Satan, the accursed, and I seek refuge in You from the evil of the Day of Judgement. O Allah, I seek refuge in You from sudden death, the bite of a snake, a wild beast, drowning, burning, falling upon something, and being killed while fleeing from battle."}], "themes": {"d1": "Good in both worlds", "d2": "Patience and firm resolve", "d3": "Forgiveness and relief from burdens", "d4": "Hearts steadfast in guidance", "d5": "Faith and forgiveness", "d6": "Creation and salvation", "d7": "Protection from disgrace", "d8": "Faith and a righteous end", "d9": "Fulfilment of the divine promise", "d10": "Adam and his wife’s prayer of repentance", "d11": "Patience and a Muslim death", "d12": "Allah as Protector", "d13": "Deliverance from oppression", "d14": "Yusuf’s prayer for a righteous end", "d15": "Establishing prayer", "d16": "Forgiveness for parents and believers", "d17": "Mercy for parents", "d18": "An honourable entrance and exit", "d19": "Mercy and right guidance", "d20": "Musa’s prayer for ease and clear speech", "d21": "Increase in knowledge", "d22": "Ayyub’s prayer in hardship", "d23": "Zakariyya’s prayer for family", "d24": "A blessed place to settle", "d25": "Protection from devils", "d26": "Faith, forgiveness and mercy", "d27": "Protection from Hell", "d28": "Righteous family and leadership", "d29": "Gratitude and righteous deeds", "d30": "Musa’s prayer in need", "d31": "Help against corruption", "d32": "Forgiveness for the repentant", "d33": "Paradise with righteous family", "d34": "Gratitude, repentance and righteous descendants", "d35": "Nuh’s prayer when overwhelmed", "d36": "Forgiveness and a heart free of rancour", "d37": "Trust and return to Allah", "d38": "Protection from persecution", "d39": "Perfected light and forgiveness", "d40": "Forgiveness for all believers", "d41": "Cleansing the heart of sins", "d42": "Purifying the soul", "d43": "The good sought by the Prophet", "d44": "Forgiveness, good deeds and salvation", "d45": "Beneficial knowledge", "d46": "Forgiveness for mistakes and deliberate sins", "d47": "Forgiveness for ignorance and excess", "d48": "Forgiveness in earnest and in jest", "d49": "Hearts directed to obedience", "d50": "Guidance and a straight course", "d51": "Guidance, piety and contentment", "d52": "Religion, worldly life and the Hereafter", "d53": "Forgiveness, mercy, well-being and provision", "d54": "Comprehensive protection from spiritual and worldly harms", "d55": "Help, gratitude, repentance and a purified heart", "d56": "Forgiveness, mercy and all affairs put right", "d57": "United hearts, peace and blessings for the family", "d58": "Steadfastness, gratitude and upright character", "d59": "Forgiveness, reverence and protection of religion", "d60": "Increase, honour, provision and contentment", "d61": "Inspiration toward right guidance", "d62": "Protection from the self and resolve for right conduct", "d63": "Well-being in this world and the Hereafter", "d64": "Good deeds, love and protection from trials", "d65": "Love of Allah above self, family and comfort", "d66": "Loved gifts as strength for obedience", "d67": "Freedom for what Allah loves", "d68": "A heart firm upon religion", "d69": "Unwavering faith and companionship in Paradise", "d70": "Health, faith, character and success", "d71": "Beneficial knowledge", "d72": "Life, death, contentment and the vision of Allah", "d73": "Every good, known and unknown", "d74": "Paradise and a good outcome for every decree", "d75": "A good ending and protection from disgrace", "d76": "Preservation in Islam and Allah’s abundant good", "d77": "Forgiveness, relief, debt and every need", "d78": "Help in remembrance, gratitude and worship", "d79": "Contentment, blessing and care for what is absent", "d80": "A pure life, good death and honourable return", "d81": "Strength in weakness and honour through Islam", "d82": "The best of life, deeds and the Hereafter", "d83": "Abundant provision in old age", "d84": "A good end and steadfastness until meeting Allah", "d85": "Protection from affliction, misguidance and a harmful death", "d86": "Patience, gratitude and humility", "d87": "Blessings and contentment", "d88": "Beautiful character and a peaceful heart", "d89": "Faith at death", "d90": "Goodness of today and what follows", "d91": "Goodness of the day", "d92": "Pardon and protection on every side", "d93": "Mercy and putting affairs right", "d94": "Divine light and protection from the Fire", "d95": "A day of goodness", "d96": "Forgiveness and a place in the highest assembly", "d97": "Protection on the Resurrection Day", "d98": "Refuge from all harmful creatur   // search across all duas: number, theme and English

  function runSearch(){
    var raw=q.value.trim();
    if(!raw){ results.hidden=true; browse.hidden=false; return; }
    browse.hidden=true; results.hidden=false;
    var words=norm(raw).split(/\s+/).filter(Boolean), out=[];
    SEARCH.forEach(function(x){
      if(/^\d/.test(raw)){ if(x.n.replace(/\D+$/,'')===raw.replace(/\D+$/,'')||x.n===raw) out.push([0,x]); return; }
      var score=0, ok=words.every(function(w){ var inT=x._t.indexOf(w)>=0, inE=x._e.indexOf(w)>=0; if(inT) score+=2; if(inE) score+=1; return inT||inE; });

  }
  q.addEventListener('input',runSearch);

  // links inside pages: topic numbers, the list of every du'a, notes that point to a source entry
