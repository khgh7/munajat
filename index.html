<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Munajat-e-Maqbool</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Munajat">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fafbf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121815" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Sans:wght@500;600&display=swap">
<style>
/* Layout: a book of pages, one dua per page, flicked sideways; each page scrolls down on its own when long */
:root{
  --bg:#fafbf8;          /* page, faint green bias */
  --panel:#f1f3ee;       /* commentary panels */
  --ink:#1c2420;         /* Arabic + English text */
  --muted:#5c6862;       /* secondary text */
  --green:#2f5444;       /* the edition's deep green */
  --gold:#b08d43;        /* the edition's gold hairlines */
  --line:#dfe3dc;
  --bar:#fafbf8;
  --serif:"EB Garamond", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --sans:"Instrument Sans", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --en: 1.2rem;
  --k: .17;              /* Arabic scale: CSS px per printed pixel, set by script */
  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --panel:#1b231f; --ink:#e7ebe4; --muted:#9aa69f; --green:#8fbfa6; --gold:#cfae67; --line:#2a332e; --bar:#121815; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121815; --panel:#1b231f; --ink:#e7ebe4; --muted:#9aa69f; --green:#8fbfa6; --gold:#cfae67; --line:#2a332e; --bar:#121815; color-scheme:dark;
}
/* reader's own Display choice wins over the phone setting */
:root[data-mode="light"]{
  --bg:#fafbf8; --panel:#f1f3ee; --ink:#1c2420; --muted:#5c6862; --green:#2f5444; --gold:#b08d43; --line:#dfe3dc; --bar:#fafbf8; color-scheme:light;
}
:root[data-mode="dark"]{
  --bg:#121815; --panel:#1b231f; --ink:#e7ebe4; --muted:#9aa69f; --green:#8fbfa6; --gold:#cfae67; --line:#2a332e; --bar:#121815; color-scheme:dark;
}
:root[data-mode="black"]{
  --bg:#000; --panel:#121212; --ink:#f4f4f2; --muted:#a3a3a0; --green:#a9cdb9; --gold:#d6b46c; --line:#262626; --bar:#000; color-scheme:dark;
}
html{height:100%;box-sizing:border-box;-webkit-text-size-adjust:100%}
body{margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bar)}

/* top bar */
.bar{position:relative;flex:none;padding-block:10px;padding-left:var(--gut-l);padding-right:var(--gut-r);background:var(--bar);border-bottom:1px solid var(--line)}
.bar-in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:10px}
.where{flex:1;min-width:0;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where b{font-weight:600}
.where span{color:var(--muted)}
.btn{font-family:var(--sans);font-weight:600;font-size:.82rem;color:var(--green);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:36px;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.progress{position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:var(--gold);transform-origin:0 50%;transform:scaleX(0);transition:transform .2s}
[dir="rtl"] .progress{transform-origin:100% 50%}

/* the book */
.pager{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pager::-webkit-scrollbar{display:none}
.page{outline:none;flex:0 0 100%;width:100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;font-family:var(--serif)}
.pin{max-width:620px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:24px 40px;display:grid;gap:18px;align-content:start}

.hero{display:grid;gap:6px;padding-block:18px 14px}
.kicker{font-family:var(--sans);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hero h1{margin:0;font-weight:500;font-size:clamp(3rem,15vw,4.4rem);line-height:.95;color:var(--green);letter-spacing:-.01em}
.hero p{margin:6px 0 0;font-size:1.08rem;color:var(--muted)}

.sh{display:flex;align-items:baseline;gap:12px}
.sh::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent);opacity:.55;align-self:center}
.eyebrow{font-family:var(--sans);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
.num{font-size:2.2rem;line-height:1;font-weight:500;color:var(--gold);font-variant-numeric:lining-nums}
.num.word{font-size:1.6rem;color:var(--green)}
.bism{display:grid;gap:10px;justify-items:center;padding-bottom:8px}

/* Arabic: each printed word is a window onto its printed line, so words rewrap right to left at any size */
.arw{display:flex;flex-wrap:wrap;direction:rtl;justify-content:center;align-items:flex-start;max-width:100%;
  padding-top:calc(var(--k) * 33px)}
.ln{display:contents}
.ln i{display:block;flex:none;width:calc(var(--w) * var(--k) * 1px);height:calc(248px * var(--k));
  margin-left:calc(var(--g) * var(--k) * 1px);margin-top:calc(var(--k) * -33px);
  background:var(--ink);
  -webkit-mask-image:var(--m);mask-image:var(--m);
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-size:calc(var(--lw) * var(--k) * 1px) 100%;mask-size:calc(var(--lw) * var(--k) * 1px) 100%;
  -webkit-mask-position:calc(var(--x) * var(--k) * -1px) 0;mask-position:calc(var(--x) * var(--k) * -1px) 0}
.en{margin:0;font-size:var(--en);line-height:1.55;max-width:65ch;text-wrap:pretty}
.en-quiet{font-size:calc(var(--en) * .86);color:var(--muted);text-align:center}
.comm{background:var(--panel);border-radius:6px;padding:14px 16px 16px;display:grid;gap:6px}
.comm h3{margin:0;font-family:var(--sans);font-size:.68rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--green)}
.comm p{margin:0;font-size:calc(var(--en) * .9);line-height:1.55;color:var(--muted)}
.closing .en{text-align:center;margin-inline:auto}
.seg button.arb{font-family:"Geeza Pro","Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;line-height:1}
.swipe-hint{margin:8px 0 0;font-family:var(--sans);font-size:.8rem;letter-spacing:.04em;color:var(--gold);text-align:center}

body.no-en .en:not(.en-quiet){display:none}
body.no-comm .comm:not(.note){display:none}

.about{border-top:1px solid var(--gold);margin-top:8px;padding-top:18px;color:var(--muted);font-size:.95rem;line-height:1.5}
.about h3{font-family:var(--sans);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;margin:0 0 8px;color:var(--green)}
.about p{margin:0 0 10px}

/* page footer */
.foot{flex:none;border-top:1px solid var(--line);background:var(--bar);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom, 0px));padding-left:var(--gut-l);padding-right:var(--gut-r)}
.foot-in{max-width:620px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.turn{display:grid;place-items:center;width:48px;height:44px;border:0;background:transparent;color:var(--green);cursor:pointer;border-radius:10px}
.turn:disabled{opacity:.25;cursor:default}
.turn svg{width:22px;height:22px}
[dir="rtl"] .turn svg{transform:scaleX(-1)}
.count{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.03em}

/* sheets */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,14,12,.38)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:16px 16px 0 0;border-top:1px solid var(--line);
  max-height:80%;overflow:auto;padding-top:10px;padding-bottom:calc(20px + env(safe-area-inset-bottom, 0px));padding-left:var(--gut-l);padding-right:var(--gut-r);
  box-shadow:0 -8px 30px rgba(0,0,0,.15);font-family:var(--serif)}
.sheet-in{max-width:620px;margin:0 auto;display:grid;gap:16px}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 0}
.sheet-h{display:flex;align-items:center;justify-content:space-between}
.sheet-h h2{margin:0;font-weight:500;font-size:1.5rem;color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.jn{display:grid;place-items:center;min-height:48px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);font-size:1.2rem;font-variant-numeric:lining-nums tabular-nums}
.jn.wide{grid-column:span 2;font-size:1rem;line-height:1.1}
.jn small{font-family:var(--sans);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.jn.cur{border-color:var(--gold);background:var(--panel);color:var(--green)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:8px;border-bottom:1px solid var(--line)}
.row label,.row .lbl{font-size:1.1rem}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{font-family:var(--serif);font-size:1rem;border:0;background:transparent;color:var(--ink);min-width:44px;min-height:40px;padding-inline:12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--bg)}
.sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw:checked{background:var(--green)}
.sw:checked::after{transform:translateX(20px)}
.hint{font-size:.95rem;color:var(--muted);margin:0;line-height:1.45}
@media (prefers-reduced-motion: reduce){.progress,.sw::after{transition:none}}
/* days */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dy{position:relative;display:grid;place-items:center;gap:2px;min-height:54px;padding:6px 2px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font-family:var(--serif);font-size:1.05rem;cursor:pointer}
.dy small{font-family:var(--sans);font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dy[aria-current="true"]{border-color:var(--gold);background:var(--panel);color:var(--green)}
.dy:disabled{opacity:.38;cursor:default}
.dy.today::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.sub{margin:0;font-family:var(--sans);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.state{flex:0 0 100%;display:grid;place-content:center;justify-items:center;gap:14px;padding-inline:var(--gut-l) var(--gut-r);text-align:center;font-family:var(--serif);font-size:1.15rem;color:var(--muted)}
.state .btn{font-size:.9rem}
.nextday{justify-self:center;margin-top:6px;font-family:var(--sans);font-weight:600;font-size:.9rem;color:var(--bg);background:var(--green);border:0;border-radius:999px;padding:12px 20px;cursor:pointer}
</style>
<style>html{padding-top:env(safe-area-inset-top, 0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>

<div class="bar" id="bar">
  <div class="bar-in" dir="ltr">
    <div class="where" id="where"><b>Munajat-e-Maqbool</b></div>
    <button class="btn" id="openIndex" type="button" aria-haspopup="dialog">Index</button>
    <button class="btn" id="openSettings" type="button" aria-haspopup="dialog" aria-label="Reading settings">Aa</button>
  </div>
  <div class="progress" id="progress"></div>
</div>

<main class="pager" id="pager" dir="ltr">
  <div class="state" id="state"><span>Opening…</span></div>
</main>

<nav class="foot" id="foot" dir="ltr" aria-label="Turn pages">
  <div class="foot-in">
    <button class="turn" id="prev" type="button" aria-label="Previous page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="count" id="count"></span>
    <button class="turn" id="next" type="button" aria-label="Next page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="indexSheet" role="dialog" aria-modal="true" aria-labelledby="ixh" hidden>
  <div class="sheet-in">
    <div class="grab"></div>
    <div class="sheet-h"><h2 id="ixh">Index</h2><button class="btn" type="button" data-close>Done</button></div>
    <div class="days" id="days" role="group" aria-label="Day"></div>
    <p class="sub" id="daySub"></p>
    <nav class="grid" id="grid"></nav>
  </div>
</div>
<div class="sheet" id="setSheet" role="dialog" aria-modal="true" aria-labelledby="sth" hidden>
  <div class="sheet-in">
    <div class="grab"></div>
    <div class="sheet-h"><h2 id="sth">Reading</h2><button class="btn" type="button" data-close>Done</button></div>
    <div class="row"><span class="lbl">Display</span>
      <div class="seg" id="modeSeg"><button type="button" data-m="auto">Auto</button><button type="button" data-m="light">Light</button><button type="button" data-m="dark">Dark</button><button type="button" data-m="black">Black</button></div></div>
    <div class="row"><span class="lbl">Arabic size</span>
      <div class="seg" id="arSeg"><button type="button" data-a="1" aria-label="Small" class="arb">ع</button><button type="button" data-a="1.3" aria-label="Medium" class="arb" style="font-size:1.35rem">ع</button><button type="button" data-a="1.6" aria-label="Large" class="arb" style="font-size:1.6rem">ع</button></div></div>
    <div class="row"><span class="lbl">English size</span>
      <div class="seg" id="sizeSeg"><button type="button" data-s="1.05rem" aria-label="Small">A</button><button type="button" data-s="1.2rem" aria-label="Medium" style="font-size:1.15rem">A</button><button type="button" data-s="1.38rem" aria-label="Large" style="font-size:1.3rem">A</button></div></div>
    <div class="row"><label for="tEn">Translation</label><input class="sw" type="checkbox" id="tEn" checked></div>
    <div class="row"><label for="tComm">Commentary</label><input class="sw" type="checkbox" id="tComm" checked></div>
    <div class="row"><span class="lbl">Page turning</span>
      <div class="seg" id="dirSeg"><button type="button" data-d="ltr">English book</button><button type="button" data-d="rtl">Urdu book</button></div></div>
    <p class="hint" id="dirHint"></p>
    <p class="hint">The Arabic is the original printing. At larger sizes the words wrap onto more lines than in the book. On a new day the app opens that day's portion.</p>
  </div>
</div>

<script>
(function(){
  // The weekly cycle starts on Saturday. Days without a file yet are shown but can't be opened.
  var DAYS=[{"key": "saturday", "name": "Saturday"}, {"key": "sunday", "name": "Sunday"}, {"key": "monday", "name": "Monday", "manzil": "Third manzil", "first": 86, "last": 116, "file": "days/monday.html"}, {"key": "tuesday", "name": "Tuesday", "manzil": "Fourth manzil", "first": 117, "last": 150, "file": "days/tuesday.html"}, {"key": "wednesday", "name": "Wednesday"}, {"key": "thursday", "name": "Thursday"}, {"key": "friday", "name": "Friday"}];
  var WEEK=['sunday','monday','tuesday','wednesday','thursday','friday','saturday']; // JS getDay() order
  var KEY='munajat-v3', OLD='munajat-mon-v2';
  function load(k){try{return JSON.parse(localStorage.getItem(k))||null}catch(e){return null}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
  var st=load(KEY);
  if(!st){ var o=load(OLD)||{}; st={size:o.size,ar:o.ar,mode:o.mode,dir:o.dir,en:o.en,comm:o.comm,pos:{}}; }
  st.pos=st.pos||{};
  function dateStr(d){d=d||new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
  var TODAY=dateStr(), todayKey=WEEK[new Date().getDay()];
  function day(k){for(var i=0;i<DAYS.length;i++) if(DAYS[i].key===k) return DAYS[i]; return null}
  function avail(k){var d=day(k);return !!(d&&d.file)}

  var root=document.documentElement, body=document.body;
  var pager=document.getElementById('pager'), foot=document.getElementById('foot');
  var where=document.getElementById('where'), prog=document.getElementById('progress'), count=document.getElementById('count');
  var prevB=document.getElementById('prev'), nextB=document.getElementById('next');
  var pages=[], N=0, cur=-1, curDay=null, links={};

  function dir(){ return st.dir==='rtl'?'rtl':'ltr'; }
  function width(){ return pager.clientWidth||1; }
  function indexNow(){ return Math.max(0,Math.min(N-1,Math.round(Math.abs(pager.scrollLeft)/width()))); }
  function goTo(i,smooth){
    if(!N) return;
    i=Math.max(0,Math.min(N-1,i));
    var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    pager.scrollTo({left:i*width()*(dir()==='rtl'?-1:1),behavior:(smooth&&!reduce)?'smooth':'auto'});
    setCur(i);
  }
  function setCur(i){
    if(i===cur||!N) return; cur=i;
    var p=pages[i], d=day(curDay);
    where.innerHTML='<b>'+p.dataset.label+'</b> <span>· '+d.name+'</span>';
    count.textContent=(i+1)+' of '+N;
    prog.style.transform='scaleX('+(N>1?i/(N-1):1)+')';
    prevB.disabled=i===0; nextB.disabled=i===N-1;
    for(var k in links) links[k].classList.toggle('cur',k===p.id);
    pages.forEach(function(pg,j){ if(j===i) pg.removeAttribute('aria-hidden'); else pg.setAttribute('aria-hidden','true'); });
    st.day=curDay; st.pos[curDay]={id:p.id,date:TODAY}; st.lastDate=TODAY; save();
  }

  // ---- loading a day ----
  var cache={}, loading=0;
  function showState(html){ pager.innerHTML='<div class="state">'+html+'</div>'; pages=[]; N=0; cur=-1; count.textContent=''; prevB.disabled=nextB.disabled=true; }
  function openDay(key,targetId){
    var d=day(key); if(!d||!d.file) return;
    var ticket=++loading;
    function render(html){
      if(ticket!==loading) return;
      curDay=key; cur=-1;
      pager.innerHTML=html;
      pages=[].slice.call(pager.querySelectorAll('.page'));
      pages.forEach(function(p){p.setAttribute('dir','ltr')});
      N=pages.length;
      var nb=pager.querySelector('[data-next-day]');
      if(nb){ var nk=nb.getAttribute('data-next-day'); if(avail(nk)){ nb.hidden=false; nb.textContent='Continue to '+day(nk).name; } }
      buildIndex();
      applySettings();
      var start=0; pages.forEach(function(p,j){ if(p.id===targetId) start=j; });
      requestAnimationFrame(function(){ goTo(start,false); if(cur!==start){cur=-1;setCur(start);} });
    }
    if(cache[key]) return render(cache[key]);
    showState('<span>Opening '+d.name+'…</span>');
    fetch(d.file).then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
      .then(function(t){ cache[key]=t; render(t); })
      .catch(function(){
        if(ticket!==loading) return;
        showState('<span>'+d.name+' could not be opened. Check your internet connection, then try again.</span><button class="btn" type="button" id="retry">Try again</button>');
        document.getElementById('retry').addEventListener('click',function(){openDay(key,targetId)});
      });
  }
  function startFor(key){ var p=st.pos[key]; return (p&&p.date===TODAY)?p.id:'opening'; }

  // ---- index sheet ----
  var daysEl=document.getElementById('days'), grid=document.getElementById('grid'), daySub=document.getElementById('daySub');
  DAYS.forEach(function(d){
    var b=document.createElement('button'); b.type='button'; b.className='dy'+(d.key===todayKey?' today':''); b.dataset.key=d.key;
    b.innerHTML=d.name.slice(0,3)+(d.file?'':'<small>soon</small>');
    b.setAttribute('aria-label',d.name+(d.key===todayKey?', today':'')+(d.file?'':', not added yet'));
    if(!d.file) b.disabled=true;
    daysEl.appendChild(b);
  });
  daysEl.addEventListener('click',function(e){ var b=e.target.closest('.dy'); if(!b||b.disabled) return; if(b.dataset.key!==curDay) openDay(b.dataset.key,startFor(b.dataset.key)); });
  function buildIndex(){
    var d=day(curDay);
    [].forEach.call(daysEl.children,function(b){b.setAttribute('aria-current',String(b.dataset.key===curDay))});
    daySub.textContent=d.manzil+' · supplications '+d.first+' to '+d.last;
    var h='';
    pages.forEach(function(p){
      var id=p.id;
      if(id==='opening') h+='<a href="#opening" class="jn wide" data-target="opening">Opening<small>praise</small></a>';
      else if(id==='closing') h+='<a href="#closing" class="jn wide" data-target="closing">Closing<small>durood</small></a>';
      else h+='<a href="#'+id+'" class="jn" data-target="'+id+'">'+id.slice(1)+'</a>';
    });
    grid.innerHTML=h; links={};
    [].forEach.call(grid.querySelectorAll('.jn'),function(a){links[a.dataset.target]=a});
  }
  grid.addEventListener('click',function(e){
    var a=e.target.closest('.jn'); if(!a)return; e.preventDefault(); opener=null; hide();
    pages.forEach(function(p,j){ if(p.id===a.dataset.target) goTo(j,false); });
  });
  pager.addEventListener('click',function(e){ var b=e.target.closest('[data-next-day]'); if(b) openDay(b.getAttribute('data-next-day'),'opening'); });

  // ---- settings ----
  function applySettings(){
    var d=dir();
    pager.setAttribute('dir',d); foot.setAttribute('dir',d); document.getElementById('bar').setAttribute('dir',d);
    root.style.setProperty('--en', st.size||'1.2rem');
    [].forEach.call(document.querySelectorAll('#sizeSeg button'),function(b){b.setAttribute('aria-pressed',String(b.dataset.s===(st.size||'1.2rem')))});
    [].forEach.call(document.querySelectorAll('#dirSeg button'),function(b){b.setAttribute('aria-pressed',String(b.dataset.d===d))});
    document.getElementById('dirHint').textContent = d==='rtl' ? 'Swipe from left to right to go forward, like an Urdu or Arabic book.' : 'Swipe from right to left to go forward, like an English book.';
    var h=document.getElementById('hint'); if(h) h.textContent = d==='rtl' ? 'Swipe left to right to turn the page' : 'Swipe right to left to turn the page';
    body.classList.toggle('no-en', st.en===false);
    body.classList.toggle('no-comm', st.comm===false);
    document.getElementById('tEn').checked = st.en!==false;
    document.getElementById('tComm').checked = st.comm!==false;
    var m=st.mode||'auto';
    if(m==='auto') root.removeAttribute('data-mode'); else root.setAttribute('data-mode',m);
    [].forEach.call(document.querySelectorAll('#modeSeg button'),function(b){b.setAttribute('aria-pressed',String(b.dataset.m===m))});
    var a=String(st.ar||'1');
    [].forEach.call(document.querySelectorAll('#arSeg button'),function(b){b.setAttribute('aria-pressed',String(b.dataset.a===a))});
    sizeArabic();
  }
  // Small fits a full printed line to the screen; Medium and Large scale up from there
  var LINE=2032;
  function sizeArabic(){
    var gut=32, pin=pager.querySelector('.pin');
    if(pin){ var cs=getComputedStyle(pin); gut=parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight); }
    var avail=Math.min(620,pager.clientWidth)-gut;
    if(!(avail>0)) return;
    root.style.setProperty('--k', (Math.min(0.2, avail/LINE)*(parseFloat(st.ar)||1)).toFixed(4));
  }
  applySettings();
  document.getElementById('modeSeg').addEventListener('click',function(e){var b=e.target.closest('button'); if(!b)return; st.mode=b.dataset.m; applySettings(); save();});
  document.getElementById('arSeg').addEventListener('click',function(e){var b=e.target.closest('button'); if(!b)return; st.ar=b.dataset.a; applySettings(); save();});
  document.getElementById('dirSeg').addEventListener('click',function(e){var b=e.target.closest('button'); if(!b)return; var i=cur; st.dir=b.dataset.d; applySettings(); save(); cur=-1; goTo(i,false);});
  document.getElementById('sizeSeg').addEventListener('click',function(e){var b=e.target.closest('button'); if(!b)return; st.size=b.dataset.s; applySettings(); save();});
  document.getElementById('tEn').addEventListener('change',function(){st.en=this.checked;applySettings();save()});
  document.getElementById('tComm').addEventListener('change',function(){st.comm=this.checked;applySettings();save()});

  // ---- turning pages ----
  var raf=0;
  pager.addEventListener('scroll',function(){ if(!raf) raf=requestAnimationFrame(function(){raf=0; setCur(indexNow());}); },{passive:true});
  prevB.addEventListener('click',function(){goTo(cur-1,true)});
  nextB.addEventListener('click',function(){goTo(cur+1,true)});
  document.addEventListener('keydown',function(e){
    if(open){ if(e.key==='Escape') hide(); return; }
    var fwd = dir()==='rtl' ? 'ArrowLeft' : 'ArrowRight', back = dir()==='rtl' ? 'ArrowRight' : 'ArrowLeft';
    if(e.key===fwd){e.preventDefault();goTo(cur+1,true)} else if(e.key===back){e.preventDefault();goTo(cur-1,true)}
  });
  var rt; window.addEventListener('resize',function(){ var i=cur; clearTimeout(rt); rt=setTimeout(function(){sizeArabic();cur=-1;goTo(i,false)},60); });

  // ---- sheets ----
  var scrim=document.getElementById('scrim'), open=null, opener=null;
  function show(id,btn){ hide(); open=document.getElementById(id); opener=btn; open.hidden=false; scrim.hidden=false;
    var f=open.querySelector('.jn.cur')||open.querySelector('button,input,a'); if(f){ f.focus({preventScroll:true}); if(f.classList.contains('jn')) f.scrollIntoView({block:'nearest'}); } }
  function hide(){ if(!open)return; open.hidden=true; scrim.hidden=true; open=null; if(opener) opener.focus({preventScroll:true}); }
  document.getElementById('openIndex').addEventListener('click',function(){show('indexSheet',this)});
  document.getElementById('openSettings').addEventListener('click',function(){show('setSheet',this)});
  scrim.addEventListener('click',hide);
  [].forEach.call(document.querySelectorAll('[data-close]'),function(b){b.addEventListener('click',hide)});

  // ---- where to start ----
  // A link to a supplication (#d120) opens its day. Otherwise: on a new day, today's portion from the start;
  // the same day, wherever the reader left off.
  var hash=(location.hash||'').slice(1), m=/^d(\d+)$/.exec(hash), startDay=null, startId=null;
  if(m){ var n=+m[1]; DAYS.forEach(function(d){ if(d.file&&n>=d.first&&n<=d.last){startDay=d.key;startId=hash;} }); }
  if(!startDay && avail(todayKey) && st.lastDate!==TODAY){ startDay=todayKey; startId='opening'; }
  if(!startDay && st.day && avail(st.day)){ startDay=st.day; startId=(st.pos[st.day]||{}).id||'opening'; }
  if(!startDay){ startDay=avail(todayKey)?todayKey:DAYS.filter(function(d){return d.file})[0].key; startId='opening'; }
  openDay(startDay,startId);
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
